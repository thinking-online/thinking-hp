<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#172642">
<title>THINKING 合格部屋｜学部別対策ライブラリー</title>
<link rel="preload" as="image" href="img/top-800.webp" imagesrcset="img/top-800.webp 800w, img/top-1400.webp 1400w" imagesizes="(max-width: 560px) 100vw, 560px">
<style>
  :root{
    --navy:#172642; --navy-2:#24365a; --gold:#C8A55A;
    --paper:#F6F4EF; --card:#fff; --ink:#1C2433; --muted:#6B7280; --line:#E6E2D8;
    --soft:#EFEBE2; --ok:#1f7a4d; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom))}

  /* ヘッダーと検索 */
  .top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 12px}
  .top-in{max-width:560px;margin:0 auto;padding:0 16px}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand-name{font-size:15px;font-weight:700;letter-spacing:.06em;color:inherit;text-align:left;padding:0;cursor:pointer}
  .brand-name small{display:block;font-size:10px;font-weight:500;letter-spacing:.18em;color:var(--gold)}
  .me{font-size:11px;color:#c9d0de;text-align:right;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 検索：右下の虫眼鏡が、押すと左へ横に伸びて検索窓になる。× で元の丸に戻る */
  .sbar{position:fixed;right:max(16px, calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom) + var(--kb, 0px));z-index:40;
    width:56px;height:56px;border-radius:28px;background:var(--navy);display:flex;align-items:center;overflow:hidden;
    box-shadow:0 6px 18px rgba(23,38,66,.32),0 1px 3px rgba(23,38,66,.2);transition:width .26s cubic-bezier(.2,.8,.2,1),background .2s}
  .sbar.open{width:min(528px, calc(100vw - 32px));background:#fff;border:2px solid var(--navy)}
  .sbar .go{flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:#fff}
  .sbar:not(.open) .go{width:56px;height:56px}
  .sbar.open .go{color:var(--navy);pointer-events:none}
  .sbar input{flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;font-size:16px;color:var(--ink);padding:0;opacity:0;transition:opacity .15s}
  .sbar.open input{opacity:1;transition-delay:.12s}
  .sbar .close{flex:none;width:40px;height:40px;margin-right:6px;border-radius:50%;background:var(--navy);color:#fff;display:none;align-items:center;justify-content:center}
  .sbar.open .close{display:flex}
  .sbar:not(.open):active{transform:scale(.94)}

  /* 共通パーツ */
  h2.sec{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:26px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
  .list{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);width:100%;text-align:left}
  .row:active{background:var(--soft)}
  .row .main{flex:1;min-width:0}
  .row .t{font-weight:700;font-size:15px;line-height:1.4}
  .row .s{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .chev{color:#b8b2a4;flex:none}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;vertical-align:2px;margin-left:6px}
  .tag.new{background:var(--gold);color:#fff}
  .tag.sample{background:#e8eef8;color:var(--navy)}
  .tag.hidden{background:#eee;color:#888}
  .lock{flex:none;color:#a39d8f}
  .empty{color:var(--muted);font-size:13px;padding:14px 4px}
  .notice{margin-top:16px;padding:14px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);font-size:13px}
  .notice b{display:block;font-size:14px;margin-bottom:4px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;width:100%;margin-top:10px}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .btn.gold{background:var(--gold)}

  /* ホーム：トップ画像（16:9。端から端まで。画像の上に文字は重ねない＝画像の中に名前が入っているため） */
  .top-hero{position:relative;display:block;margin:0 -16px;aspect-ratio:1400/788;background:#dfe9f2;overflow:hidden}
  .top-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .lead{margin:14px 2px 0;font-size:13px;line-height:1.7;color:var(--muted)}
  .lead b{color:var(--ink)}
  @media (min-width:561px){.top-hero{margin:16px 0 0;border-radius:var(--radius);border:1px solid var(--line)}}

  /* ホーム：グループタブと大学 */
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--muted)}
  .tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .unis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
  .uni{display:flex;flex-direction:column;padding:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--radius);text-align:left}
  .uni:active{background:var(--soft)}
  .uni:active .pic img{transform:scale(1.02)}
  .uni .ub{padding:10px 12px 12px}
  .uni .t{font-weight:700;font-size:15px;line-height:1.35}
  .uni .s{font-size:11px;color:var(--muted);margin-top:1px}

  /* 大学の画像（16:9）。画像がないときは同じ大きさの枠だけ残し、大学名の頭文字を薄く出す */
  .pic{position:relative;display:block;aspect-ratio:16/9;background:var(--soft);overflow:hidden;flex:none}
  .pic::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(23,38,66,.025) 14px 15px)}
  .pic .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:rgba(23,38,66,.13);letter-spacing:.02em;line-height:1;user-select:none}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s,transform .2s}
  .pic img.ok{opacity:1}
  .uni .pic .ph{font-size:34px}
  .hero{margin-top:10px;border-radius:var(--radius);border:1px solid var(--line)}
  .hero .ph{font-size:64px}
  .uni-note{font-size:13px;color:var(--muted);margin:6px 0 0}
  .thumb{width:64px;border-radius:8px;border:1px solid var(--line)}
  .bthumb{width:88px;border-radius:10px;border:1px solid var(--line);margin-top:4px}
  .bthumb .ph{font-size:22px}
  .thumb .ph{font-size:16px}
  .fav .pic{margin:-12px -12px 10px;border-radius:0}
  .fav .pic .ph{font-size:24px}
  .favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
  .favs::-webkit-scrollbar{display:none}
  .fav{flex:none;width:150px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);text-align:left;overflow:hidden}
  .fav .u{font-size:11px;color:var(--muted)}
  .fav .t{font-weight:700;font-size:14px;line-height:1.4;margin-top:2px}

  /* 問題集ページ */
  .crumb{font-size:12px;color:var(--muted);margin-top:18px}
  .crumb button{color:var(--navy);font-weight:700}
  .book-head{display:flex;align-items:flex-start;gap:12px;margin-top:6px}
  .book-head h1{flex:1;font-size:22px;line-height:1.35;margin:0}
  .star{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:#b8b2a4}
  .star.on{color:var(--gold);border-color:var(--gold)}
  .cov{margin-top:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);font-size:13px}
  .cov span{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
  .kind{margin-top:22px}
  .kind h3{font-size:12px;letter-spacing:.14em;color:var(--navy);margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .kind h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .mat{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;margin-bottom:8px}
  .mat:active{background:var(--soft)}
  .mat .ico{flex:none;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--navy);display:flex;align-items:center;justify-content:center}
  .mat .t{flex:1;font-weight:700;font-size:14px;line-height:1.45}
  .mat.locked{cursor:default;-webkit-user-select:none;user-select:none}
  .mat.locked:active{background:#fff}
  .mat.locked .t{color:#8a8578;font-weight:600}
  .mat.locked .ico{background:#f1efe9;color:#b8b2a4}
  .mat.locked .lock svg{margin-left:0}
  .toc-note{margin:14px 2px 0;font-size:12px;line-height:1.7;color:var(--muted)}
  .toc-note svg{color:var(--gold);margin-left:0;vertical-align:-1px}
  .locked-box{margin-top:18px;padding:20px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);text-align:center}
  .locked-box svg{color:var(--gold)}
  .locked-box p{font-size:13px;color:var(--muted);margin:8px 0 4px}

  /* ビューア */
  .viewer{position:fixed;inset:0;z-index:50;background:#2b2f36;display:flex;flex-direction:column}
  .viewer[hidden]{display:none}
  .vbar{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 8px 8px}
  .vbar .back{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
  .vbar .vt{flex:1;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vbody{flex:1;position:relative}
  .vpages{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 8px 16px}
  .vpage{position:relative;max-width:820px;margin:0 auto 10px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
  .vpage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .vpages,.vpage canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .vload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#c9d0de;font-size:13px;text-align:center;padding:24px;z-index:1}
  .vload[hidden]{display:none}
  .vload .btn{width:auto;padding:0 20px;height:42px;font-size:14px}
  .vfoot{background:var(--navy);padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
  .vfoot .btn{margin:0}
  .vnote{margin:0 0 8px;font-size:11px;line-height:1.5;color:#c9d0de;text-align:center}

  /* 確認ダイアログ */
  .modal{position:fixed;inset:0;z-index:90;background:rgba(15,22,36,.55);display:flex;align-items:center;justify-content:center;padding:24px}
  .modal[hidden]{display:none}
  .mbox{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:20px 18px 16px}
  .mbox b{display:block;font-size:16px;color:var(--navy)}
  .mbox p{font-size:13px;line-height:1.75;color:#4a4f5c;margin:10px 0 4px;white-space:pre-line}
  .mbtns{display:flex;gap:8px}
  .mbtns .btn{flex:1}

  /* 共有・転載の禁止の表記 */
  .legal{margin:28px 2px 0;font-size:11px;line-height:1.7;color:var(--muted);text-align:center}

  /* 印刷：ページ画像だけを紙に出す */
  .print-area{display:none}
  .print-page{margin:0 auto 16px;max-width:820px}
  .print-page img{display:block;width:100%;box-shadow:0 1px 6px rgba(0,0,0,.25)}
  .print-head{max-width:820px;margin:0 auto;padding:16px}
  @page{margin:0}
  @media print{
    body>*:not(.print-area){display:none!important}
    .print-area{display:block!important}
    .print-head{display:none!important}
    .print-page{margin:0;max-width:none;break-after:page;page-break-after:always}
    .print-page:last-child{break-after:auto;page-break-after:auto}
    .print-page img{width:100%;box-shadow:none}
  }

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(23,38,66,.94);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .skel{height:58px;border-radius:var(--radius);background:linear-gradient(90deg,#ece8df,#f4f1ea,#ece8df);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}
  .pv{background:#fff3cd;color:#664d03;font-size:12px;text-align:center;padding:6px}
</style>
</head>
<body>
<div class="pv" id="pv" hidden></div>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <button class="brand-name" id="brand" data-go="#/" aria-label="ホームに戻る">THINKING 合格部屋<small>学部別対策ライブラリー</small></button>
      <div class="me" id="me"></div>
    </div>
  </div>
</header>

<div class="sbar" id="sbar" role="search">
  <button class="go" id="fab" type="button" aria-label="大学・学部を検索" aria-expanded="false">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
  <input id="q" type="text" placeholder="大学・学部で検索（例：明治 商）" autocomplete="off" enterkeyhint="search" tabindex="-1" aria-label="大学・学部で検索">
  <button class="close" id="q-clear" type="button" aria-label="検索を閉じる">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<main class="wrap" id="app">
  <div style="margin-top:20px" class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<div class="viewer" id="viewer" hidden>
  <div class="vbar">
    <button class="back" id="v-back" aria-label="閉じる"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vt" id="v-title"></div>
  </div>
  <div class="vbody">
    <div class="vload" id="v-load">読み込み中…</div>
    <div class="vpages" id="v-pages"></div>
  </div>
  <div class="vfoot">
    <p class="vnote">この教材には利用者の情報が記録されています。共有・転載・譲渡は禁止です。</p>
    <button class="btn gold" id="v-print">印刷する</button>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="mbox"><b id="m-title"></b><p id="m-body"></p><div class="mbtns" id="m-btns"></div></div>
</div>
<div class="print-area" id="print-area"></div>

<div class="toast" id="toast"></div>

<script>
/* ===== 設定（セットアップ時に2か所だけ埋める）================================ */
var LIFF_ID = "2010454771-UKpPuCeO";   // LINE Developers で作った LIFF ID
var GAS_URL = "https://script.google.com/macros/s/AKfycbwkVjlCL1Q2-0qiLBuR1KSqdubXRdZUFpMydthQCcfkYoCvOhjFqauTKQcu-Bx4Xb8M/exec";   // Apps Script をデプロイした Webアプリの URL（…/exec）
/* ========================================================================= */

var PREVIEW = /[?&]preview=1/.test(location.search);
/* 確認用リンク（?k=キー）：LINEログインなしで、塾生の表示・未購入者の表示を見る。お気に入りは端末の中だけに保存 */
var LINK_KEY = PREVIEW ? "" : decodeURIComponent((location.search.match(/[?&]k=([^&#]+)/) || [])[1] || "");
var CACHE_KEY = LINK_KEY ? "kp.cache.link." + LINK_KEY.slice(0, 6) : "kp.cache.v1";
var RECENT_KEY = "kp.recent.v1";
var TAB_KEY = "kp.tab.v1";

var S = { user: null, cfg: { newDays: 14 }, catalog: null, etag: "", favs: {}, idx: null };
var $ = function (id) { return document.getElementById(id); };

/* ---------- 保存（ブラウザ保存が使えない環境でも動くように try で包む） ---------- */
function load(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function persist() {
  if (PREVIEW) return;
  save(CACHE_KEY, { user: S.user, cfg: S.cfg, catalog: S.catalog, etag: S.etag, favs: Object.keys(S.favs) });
}

/* ---------- 起動：前回の内容をすぐ表示 → 裏で最新を取りに行く ---------- */
function start() {
  if (PRINT.pt && PRINT.f) return startPrintPage();
  var c = PREVIEW ? null : load(CACHE_KEY);
  if (c && c.catalog) { applyState(c); render(); }
  if (PREVIEW) { loadScript("mock.js").then(function () { applyState(window.MOCK_BOOT()); render(); showPreviewBar(); }); return; }
  if (!LIFF_ID || !GAS_URL) { renderMessage("準備中", "ポータルの設定がまだ完了していません。"); return; }
  if (LINK_KEY) { syncBoot(); return; }
  loadScript("https://static.line-scdn.net/liff/edge/2/sdk.js")
    .then(function () { return liff.init({ liffId: LIFF_ID }); })
    .then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      return syncBoot();
    })
    .catch(function () {
      if (!S.catalog) renderMessage("LINEから開いてください", "このページはLINEアプリの中で開くと使えます。");
    });
}

function syncBoot() {
  var auth;
  if (LINK_KEY) auth = "key=" + encodeURIComponent(LINK_KEY);
  else {
    var token = idToken();
    if (!token) return;
    auth = "token=" + encodeURIComponent(token);
  }
  return getJSON(GAS_URL + "?action=boot&" + auth + "&etag=" + encodeURIComponent(S.etag || ""))
    .then(function (res) {
      if (res.status === "unauthorized" && LINK_KEY) {
        try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
        S.catalog = null;
        renderMessage("このリンクは使えません", "確認用リンクが変更されたか、停止されています。");
        return;
      }
      if (res.status === "unauthorized") { relogin(); return; }
      if (LINK_KEY) res.favs = Object.keys(S.favs);
      if (res.status !== "ok") throw new Error(res.reason || "error");
      try { sessionStorage.removeItem("kp.relogin"); } catch (e) {}
      var changed = !!res.catalog || JSON.stringify(res.favs.slice().sort()) !== JSON.stringify(Object.keys(S.favs).sort()) || !S.user || S.user.role !== res.user.role;
      applyState({ user: res.user, cfg: res.cfg, catalog: res.catalog || S.catalog, etag: res.etag, favs: res.favs });
      persist();
      if (changed) render();
      else renderMe();
    })
    .catch(function () { if (!S.catalog) renderMessage("通信できませんでした", "電波の良い場所で、もう一度開いてください。"); });
}

/** 期限切れのIDトークンを送らない（LINE内ブラウザは古いトークンを返すことがある） */
function idToken() {
  try {
    var d = liff.getDecodedIDToken();
    if (!d || d.exp * 1000 < Date.now() + 60000) { relogin(); return ""; }
    return liff.getIDToken();
  } catch (e) { return ""; }
}
function relogin() {
  if (sessionStorage.getItem("kp.relogin")) return;
  try { sessionStorage.setItem("kp.relogin", "1"); } catch (e) {}
  liff.logout();
  liff.login({ redirectUri: location.href });
}

function applyState(o) {
  S.user = o.user || S.user;
  S.cfg = o.cfg || S.cfg;
  if (o.catalog) { S.catalog = o.catalog; S.idx = buildIndex(o.catalog); }
  S.etag = o.etag || S.etag;
  if (o.favs) { S.favs = {}; o.favs.forEach(function (id) { S.favs[id] = true; }); }
}

/* ---------- 一覧の索引 ---------- */
function buildIndex(cat) {
  var books = {}, items = {}, unis = {}, order = [];
  cat.books.forEach(function (b) {
    b.hay = norm([b.g, b.u, b.uy, b.n, b.cov, b.kw].join(" "));
    books[b.id] = b;
    var key = b.g + "\u0000" + b.u;
    if (!unis[key]) { unis[key] = { g: b.g, u: b.u, uy: b.uy, books: [] }; order.push(key); }
    unis[key].books.push(b);
  });
  cat.items.forEach(function (it) { (items[it.b] = items[it.b] || []).push(it); });
  return { books: books, items: items, unis: order.map(function (k) { return unis[k]; }) };
}

/** 全角/半角・カタカナ/ひらがな・空白の違いを吸収して検索する */
function norm(s) {
  return String(s || "").normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); })
    .replace(/[\s・,、。.\-‐_/()（）「」]/g, "");
}

/* ---------- ビューア ----------
 * 教材のPDFはドライブで共有しない。開くたびに GAS が本人の権限を確かめて中身を返し、ここで描く（pdf.js）。
 * ドライブのリンクが出回っても、他の人は開けない。 */
var PDFJS_BASE = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/";
var LEGAL = ["この教材には利用者の情報が記録されています。外部への共有・転載・譲渡は禁止です。",
  "違反が確認された場合は、法的措置をとることがあります。© THINKING"];
var CUR = null, CUR_DOC = null, OPEN_SEQ = 0, PAGE_OBS = null;
var PDF_BYTES = {}, PDF_ORDER = [];

function loadPdfJs() {
  if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions.workerSrc) return Promise.resolve(pdfjsLib);
  return loadScript(PDFJS_BASE + "pdf.min.js").then(function () {
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
    return pdfjsLib;
  });
}
/** 本人の確かめ方（LINEのIDトークン／確認用リンクのキー／印刷用の合言葉）を付けて送る */
function authBody(o) {
  if (PRINT.pt) o.pt = PRINT.pt;
  else if (LINK_KEY) o.key = LINK_KEY;
  else o.token = idToken();
  return o;
}
function apiError(res) {
  var e = new Error((res && res.status) || "error");
  e.code = res && res.status;
  return e;
}
/** PDFの中身。同じ教材を続けて開いたときは通信しない（直近4冊まで覚えておく） */
function pdfBytes(fid) {
  if (PDF_BYTES[fid]) return Promise.resolve(PDF_BYTES[fid]);
  return post(authBody({ action: "pdf", file: fid })).then(function (res) {
    if (!res || res.status !== "ok") throw apiError(res);
    var bin = atob(res.data), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var out = { data: u8, name: res.name || "", title: res.title || "" };
    PDF_BYTES[fid] = out;
    PDF_ORDER.push(fid);
    if (PDF_ORDER.length > 4) delete PDF_BYTES[PDF_ORDER.shift()];
    return out;
  });
}
function openPdf(fid) {
  return Promise.all([loadPdfJs(), pdfBytes(fid)]).then(function (r) {
    // pdf.js は渡したデータを作業用スレッドに移してしまうので、写しを渡す
    return r[0].getDocument({ data: r[1].data.slice(), isEvalSupported: false }).promise.then(function (doc) { return { doc: doc, name: r[1].name, title: r[1].title }; });
  });
}

function openItem(bookId, i) {
  var it = (S.idx.items[bookId] || [])[i];
  if (!it) return;
  CUR = it;
  pushRecent(bookId);
  $("v-title").textContent = it.t;
  $("viewer").hidden = false;
  document.body.style.overflow = "hidden";
  history.pushState({ viewer: 1 }, "");
  clearPages();
  if (PREVIEW || /^mock/.test(it.f)) return viewerMessage("（プレビューのため、実際のPDFは表示されません）");
  viewerMessage("読み込み中…");
  var seq = ++OPEN_SEQ;
  openPdf(it.f).then(function (o) {
    if (seq !== OPEN_SEQ) { o.doc.destroy(); return; }
    CUR_DOC = o.doc;
    return layoutPages(o.doc, seq);
  }).catch(function (e) {
    if (seq !== OPEN_SEQ) return;
    if (e.code === "unauthorized" && !LINK_KEY) { relogin(); return; }
    viewerMessage(e.code === "forbidden" || e.code === "unauthorized" ? "この教材を開く権限がありません。" : "読み込めませんでした。電波の良い場所で、もう一度お試しください。", e.code === "forbidden" || e.code === "unauthorized" ? null : function () { openItemAgain(bookId, i); });
  });
}
function openItemAgain(bookId, i) { history.back(); setTimeout(function () { openItem(bookId, i); }, 50); }
function viewerMessage(text, retry) {
  var el = $("v-load");
  el.hidden = false;
  el.innerHTML = "<span>" + esc(text) + "</span>" + (retry ? '<button class="btn ghost" id="v-retry">もう一度読み込む</button>' : "");
  if (retry) $("v-retry").onclick = retry;
}

/** ページの枠を先に全部並べ、画面に近づいたページだけ描く（離れたら消してメモリを空ける） */
function layoutPages(doc, seq) {
  return doc.getPage(1).then(function (p1) {
    if (seq !== OPEN_SEQ) return;
    var vp = p1.getViewport({ scale: 1 });
    var box = $("v-pages");
    var html = "";
    for (var n = 1; n <= doc.numPages; n++) html += '<div class="vpage" data-p="' + n + '" style="aspect-ratio:' + vp.width + "/" + vp.height + '"></div>';
    box.innerHTML = html;
    box.scrollTop = 0;
    $("v-load").hidden = true;
    PAGE_OBS = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) {
        var el = en.target;
        if (en.isIntersecting) drawPage(doc, seq, el);
        else if (el.firstChild) { el.innerHTML = ""; el.dataset.st = ""; }
      });
    }, { root: box, rootMargin: "1200px 0px" });
    Array.prototype.forEach.call(box.children, function (el) { PAGE_OBS.observe(el); });
  });
}
function drawPage(doc, seq, el) {
  if (el.dataset.st) return;
  el.dataset.st = "1";
  doc.getPage(Number(el.dataset.p)).then(function (page) {
    if (seq !== OPEN_SEQ || el.dataset.st !== "1") return;
    var vp1 = page.getViewport({ scale: 1 });
    el.style.aspectRatio = vp1.width + "/" + vp1.height;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var scale = Math.min((el.clientWidth || 400) * dpr / vp1.width, 3);
    var vp = page.getViewport({ scale: scale });
    var c = document.createElement("canvas");
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    var ctx = c.getContext("2d");
    return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
      if (seq !== OPEN_SEQ || el.dataset.st !== "1") return;
      el.innerHTML = "";
      el.appendChild(c);
      el.dataset.st = "2";
    });
  }).catch(function () { el.dataset.st = ""; });
}

function clearPages() {
  OPEN_SEQ++;
  if (PAGE_OBS) { PAGE_OBS.disconnect(); PAGE_OBS = null; }
  if (CUR_DOC) { try { CUR_DOC.destroy(); } catch (e) {} CUR_DOC = null; }
  $("v-pages").innerHTML = "";
}
$("v-back").addEventListener("click", function () { history.back(); });
window.addEventListener("popstate", function () { if (!$("viewer").hidden) closeViewer(true); });
function closeViewer(fromHistory) {
  $("viewer").hidden = true;
  clearPages();
  document.body.style.overflow = "";
  CUR = null;
}

/* ---------- 印刷 ----------
 * ページ画像を作って印刷する。LINEの中では印刷できないので、10分だけ使える合言葉を付けて外のブラウザで開く。 */
var PRINT = (function () {
  var q = location.search;
  var g = function (k) { var m = q.match(new RegExp("[?&]" + k + "=([^&#]+)")); return m ? decodeURIComponent(m[1]) : ""; };
  return { pt: g("pt"), f: g("pf") };
})();

$("v-print").addEventListener("click", function () {
  if (!CUR) return;
  if (PREVIEW || /^mock/.test(CUR.f)) return toast("プレビューでは印刷できません");
  startPrint(CUR);
});
function startPrint(it) {
  var inLine = !LINK_KEY && window.liff && liff.isInClient && liff.isInClient();
  if (!inLine) return printPdf(it.f);
  toast("印刷の準備をしています…");
  post(authBody({ action: "printToken", file: it.f })).then(function (res) {
    if (!res || res.status !== "ok") throw apiError(res);
    var url = location.origin + location.pathname + "?pt=" + encodeURIComponent(res.pt) + "&pf=" + encodeURIComponent(it.f);
    liff.openWindow({ url: url, external: true });
  }).catch(function () { toast("印刷の準備ができませんでした。もう一度お試しください。"); });
}
/** 全ページを画像にして、印刷用の場所に並べてから印刷する */
function printPdf(fid, standalone) {
  var area = $("print-area");
  area.innerHTML = '<div class="print-head"><b>印刷の準備をしています…</b><p class="legal" id="pr-state" style="text-align:left;margin-top:6px"></p></div>';
  area.style.display = standalone ? "block" : "";
  return openPdf(fid).then(function (o) {
    var doc = o.doc, n = 0, urls = [];
    if (standalone) document.title = o.title + "（印刷）";
    var next = function () {
      n++;
      if (n > doc.numPages) return Promise.resolve();
      $("pr-state") && ($("pr-state").textContent = n + " / " + doc.numPages + " ページ");
      return doc.getPage(n).then(function (page) {
        var vp1 = page.getViewport({ scale: 1 });
        var vp = page.getViewport({ scale: 1100 / vp1.width });   // A4 幅でおよそ 130dpi（文字はくっきり、準備は速く）
        var c = document.createElement("canvas");
        c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
          return new Promise(function (ok) { c.toBlob(ok, "image/jpeg", 0.88); });
        }).then(function (blob) {
          var u = URL.createObjectURL(blob);
          urls.push(u);
          var div = document.createElement("div");
          div.className = "print-page";
          div.innerHTML = '<img alt="" src="' + u + '">';
          area.appendChild(div);
          c.width = c.height = 0;
          return next();
        });
      });
    };
    return next().then(function () {
      doc.destroy();
      var head = area.querySelector(".print-head");
      head.innerHTML = "<b>" + esc(o.title) + "</b>"
        + '<p class="legal" style="text-align:left;margin-top:6px">' + esc(LEGAL[0] + LEGAL[1]) + "</p>"
        + '<button class="btn gold" id="pr-go">印刷する</button>' + (standalone ? "" : '<button class="btn ghost" id="pr-close">閉じる</button>');
      $("pr-go").onclick = function () { window.print(); };
      if ($("pr-close")) $("pr-close").onclick = function () { closePrint(urls); };
      if (!standalone) {
        // 画面ではビューアの上に重ねて見せる（印刷ダイアログを閉じたあとも戻れるように）
        area.style.cssText = "display:block;position:fixed;inset:0;z-index:95;overflow:auto;background:#f6f4ef";
        window.print();
      } else {
        window.print();
      }
    });
  }).catch(function (e) {
    var msg = e && (e.code === "unauthorized" || e.code === "forbidden") ? "印刷用のリンクの期限が切れました。LINEのポータルから、もう一度「印刷する」を押してください。" : "印刷の準備ができませんでした。電波の良い場所で、もう一度お試しください。";
    area.innerHTML = '<div class="print-head"><b>印刷できませんでした</b><p class="legal" style="text-align:left">' + esc(msg) + "</p>" + (standalone ? "" : '<button class="btn ghost" id="pr-close">閉じる</button>') + "</div>";
    area.style.cssText = "display:block;position:fixed;inset:0;z-index:95;overflow:auto;background:#f6f4ef";
    if ($("pr-close")) $("pr-close").onclick = function () { closePrint([]); };
  });
}
function closePrint(urls) {
  urls.forEach(function (u) { URL.revokeObjectURL(u); });
  var area = $("print-area");
  area.innerHTML = "";
  area.style.cssText = "";
}
/** 外のブラウザで開いた印刷用のページ（?pt=…&pf=…）。ログインなしで、その1冊だけを印刷する */
function startPrintPage() {
  document.querySelector("header.top").style.display = "none";
  $("app").style.display = "none";
  $("sbar").style.display = "none";
  history.replaceState(null, "", location.pathname);   // 合言葉をアドレス欄に残さない
  printPdf(PRINT.f, true);
}

/* ---------- 共有しようとしたときの注意 ---------- */
function showModal(title, body, buttons) {
  $("m-title").textContent = title;
  $("m-body").textContent = body;
  var box = $("m-btns");
  box.innerHTML = "";
  (buttons || [{ label: "わかりました" }]).forEach(function (b) {
    var el = document.createElement("button");
    el.className = "btn" + (b.ghost ? " ghost" : "");
    el.textContent = b.label;
    el.onclick = function () { $("modal").hidden = true; if (b.onClick) b.onClick(); };
    box.appendChild(el);
  });
  $("modal").hidden = false;
}
var SHARE_NOTICE = "ポータルの教材は、ログインした本人だけが開けます。リンクを送っても、他の人は開けません。\n教材の共有・転載・譲渡は禁止です。違反が確認された場合は、法的措置をとることがあります。";
document.addEventListener("copy", function () { showModal("教材の共有はできません", SHARE_NOTICE); });
$("v-pages").addEventListener("contextmenu", function (ev) { ev.preventDefault(); showModal("教材の共有はできません", SHARE_NOTICE); });

function pushRecent(id) {
  var r = (load(RECENT_KEY) || []).filter(function (x) { return x !== id; });
  r.unshift(id);
  save(RECENT_KEY, r.slice(0, 8));
}

/* ---------- トップ画像（Netlify に置いた画像。端末の幅に合わせて小さい方から読む） ---------- */
function topHero() {
  return '<span class="top-hero" role="img" aria-label="THINKING 合格部屋 学部別対策ライブラリー">'
    + '<img src="img/top-800.webp" srcset="img/top-800.webp 800w, img/top-1400.webp 1400w" sizes="(max-width: 560px) 100vw, 560px" alt="" width="1400" height="788" decoding="async" fetchpriority="high"></span>';
}

/* ---------- 大学の画像 ---------- */
/**
 * Netlify に置いた大学の画像（img/uni/<名前>-640.webp・-1280.webp。16:9）。大学名 → ファイル名。
 * シート「大学」の画像欄に画像があればそちらを優先する（運営がシートだけで差し替えられるように）。
 */
var UNI_IMG = {
  "早稲田大学": "waseda", "慶應義塾大学": "keio", "明治大学": "meiji", "青山学院大学": "aoyama", "立教大学": "rikkyo",
  "中央大学": "chuo", "法政大学": "hosei", "学習院大学": "gakushuin",
  "関西大学": "kansai", "関西学院大学": "kwansei", "同志社大学": "doshisha",
  "立命館大学": "ritsumeikan", "日本大学": "nihon", "東洋大学": "toyo", "駒澤大学": "komazawa", "専修大学": "senshu",
  "京都産業大学": "kyosan", "近畿大学": "kindai", "甲南大学": "konan", "龍谷大学": "ryukoku"
};
var PIC_SIZES = { hero: "(max-width: 560px) 100vw, 560px", thumb: "64px", bthumb: "88px", "": "(max-width: 560px) 50vw, 280px" };
function uniInfo(name) { return (S.catalog && S.catalog.unis && S.catalog.unis[name]) || {}; }
/** 大学の画像（16:9）。画像が未登録・読み込み失敗のときは同じ大きさの枠に頭文字を薄く出す（レイアウトは崩れない） */
function pic(uni, w, cls) {
  var id = uniInfo(uni).i, slug = UNI_IMG[uni], src = "", set = "";
  if (id) src = /^data:/.test(id) ? id : "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w" + w;
  else if (slug) { src = "img/uni/" + slug + "-640.webp"; set = "img/uni/" + slug + "-640.webp 640w, img/uni/" + slug + "-1280.webp 1280w"; }
  var ph = String(uni || "").replace(/大学$/, "").charAt(0);
  return '<span class="pic' + (cls ? " " + cls : "") + '" aria-hidden="true"><span class="ph">' + esc(ph) + "</span>"
    + (src ? '<img src="' + esc(src) + '"' + (set ? ' srcset="' + set + '" sizes="' + PIC_SIZES[cls || ""] + '"' : "")
      + ' alt="" loading="lazy" decoding="async" onload="this.classList.add(\'ok\')" onerror="this.remove()">' : "")
    + "</span>";
}

/* ---------- 補助 ---------- */
function hasNew(bookId) { return (S.idx.items[bookId] || []).some(isNew); }
function isNew(it) {
  if (!it.d) return false;
  var days = (Date.now() - new Date(it.d + "T00:00:00+09:00").getTime()) / 86400000;
  return days <= (S.cfg.newDays || 14);
}
function getJSON(url) { return fetch(url).then(function (r) { return r.json(); }); }
/* Content-Type を付けない（text/plain のまま）。付けると CORS の事前確認で GAS が失敗する */
function post(body) { return fetch(GAS_URL, { method: "POST", body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
function loadScript(src) {
  return new Promise(function (ok, ng) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ng; document.head.appendChild(s); });
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
var tt = 0;
function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("show"); }, 1800); }
function chev() { return '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'; }
function lockIcon(n) { return '<svg width="' + n + '" height="' + n + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px;margin-left:4px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'; }
function starIcon(on) { return '<svg width="22" height="22" viewBox="0 0 24 24" fill="' + (on ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>'; }
function docIcon() { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>'; }
function showPreviewBar() {
  var role = (location.search.match(/[?&]role=(\w+)/) || [])[1] || "student";
  var bar = $("pv");
  bar.hidden = false;
  bar.innerHTML = "プレビュー表示（" + esc(role) + "）： "
    + ["student", "buyer", "guest", "staff"].map(function (r) { return '<a style="text-decoration:underline;margin:0 4px" href="?preview=1&role=' + r + location.hash + '">' + r + "</a>"; }).join("");
}

start();
