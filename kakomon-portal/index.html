<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#172642">
<title>THINKING 合格部屋｜学部別対策ライブラリー</title>
<link rel="preload" as="image" href="img/top-800.webp" imagesrcset="img/top-800.webp 800w, img/top-1400.webp 1400w" imagesizes="(max-width: 560px) 100vw, 560px">
<style>
  :root{
    --navy:#172642; --navy-2:#24365a; --gold:#C8A55A;
    --paper:#F6F4EF; --card:#fff; --ink:#1C2433; --muted:#6B7280; --line:#E6E2D8;
    --soft:#EFEBE2; --ok:#1f7a4d; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom))}

  /* ヘッダーと検索 */
  .top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 12px}
  .top-in{max-width:560px;margin:0 auto;padding:0 16px}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand-name{font-size:15px;font-weight:700;letter-spacing:.06em;color:inherit;text-align:left;padding:0;cursor:pointer}
  .brand-name small{display:block;font-size:10px;font-weight:500;letter-spacing:.18em;color:var(--gold)}
  .me{font-size:11px;color:#c9d0de;text-align:right;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 検索：右下の虫眼鏡が、押すと左へ横に伸びて検索窓になる。× で元の丸に戻る */
  .sbar{position:fixed;right:max(16px, calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom) + var(--kb, 0px));z-index:40;
    width:56px;height:56px;border-radius:28px;background:var(--navy);display:flex;align-items:center;overflow:hidden;
    box-shadow:0 6px 18px rgba(23,38,66,.32),0 1px 3px rgba(23,38,66,.2);transition:width .26s cubic-bezier(.2,.8,.2,1),background .2s}
  .sbar.open{width:min(528px, calc(100vw - 32px));background:#fff;border:2px solid var(--navy)}
  .sbar .go{flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:#fff}
  .sbar:not(.open) .go{width:56px;height:56px}
  .sbar.open .go{color:var(--navy);pointer-events:none}
  .sbar input{flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;font-size:16px;color:var(--ink);padding:0;opacity:0;transition:opacity .15s}
  .sbar.open input{opacity:1;transition-delay:.12s}
  .sbar .close{flex:none;width:40px;height:40px;margin-right:6px;border-radius:50%;background:var(--navy);color:#fff;display:none;align-items:center;justify-content:center}
  .sbar.open .close{display:flex}
  .sbar:not(.open):active{transform:scale(.94)}

  /* 共通パーツ */
  h2.sec{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:26px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
  .list{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);width:100%;text-align:left}
  .row:active{background:var(--soft)}
  .row .main{flex:1;min-width:0}
  .row .t{font-weight:700;font-size:15px;line-height:1.4}
  .row .s{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .chev{color:#b8b2a4;flex:none}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;vertical-align:2px;margin-left:6px}
  .tag.new{background:var(--gold);color:#fff}
  .tag.sample{background:#e8eef8;color:var(--navy)}
  .tag.hidden{background:#eee;color:#888}
  .lock{flex:none;color:#a39d8f}
  .empty{color:var(--muted);font-size:13px;padding:14px 4px}
  .notice{margin-top:16px;padding:14px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);font-size:13px}
  .notice b{display:block;font-size:14px;margin-bottom:4px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;width:100%;margin-top:10px}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .btn.gold{background:var(--gold)}

  /* ホーム：トップ画像（16:9。端から端まで。画像の上に文字は重ねない＝画像の中に名前が入っているため） */
  .top-hero{position:relative;display:block;margin:0 -16px;aspect-ratio:1400/788;background:#dfe9f2;overflow:hidden}
  .top-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .lead{margin:14px 2px 0;font-size:13px;line-height:1.7;color:var(--muted)}
  .lead b{color:var(--ink)}
  @media (min-width:561px){.top-hero{margin:16px 0 0;border-radius:var(--radius);border:1px solid var(--line)}}

  /* ホーム：グループタブと大学 */
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--muted)}
  .tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .unis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
  .uni{display:flex;flex-direction:column;padding:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--radius);text-align:left}
  .uni:active{background:var(--soft)}
  .uni:active .pic img{transform:scale(1.02)}
  .uni .ub{padding:10px 12px 12px}
  .uni .t{font-weight:700;font-size:15px;line-height:1.35}
  .uni .s{font-size:11px;color:var(--muted);margin-top:1px}

  /* 大学の画像（16:9）。画像がないときは同じ大きさの枠だけ残し、大学名の頭文字を薄く出す */
  .pic{position:relative;display:block;aspect-ratio:16/9;background:var(--soft);overflow:hidden;flex:none}
  .pic::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(23,38,66,.025) 14px 15px)}
  .pic .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:rgba(23,38,66,.13);letter-spacing:.02em;line-height:1;user-select:none}
  .lq{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(12px);transform:scale(1.04)}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s,transform .2s}
  .pic img.ok{opacity:1}
  .uni .pic .ph{font-size:34px}
  .hero{margin-top:10px;border-radius:var(--radius);border:1px solid var(--line)}
  .hero .ph{font-size:64px}
  .uni-note{font-size:13px;color:var(--muted);margin:6px 0 0}
  .thumb{width:64px;border-radius:8px;border:1px solid var(--line)}
  .bthumb{width:88px;border-radius:10px;border:1px solid var(--line);margin-top:4px}
  .bthumb .ph{font-size:22px}
  .thumb .ph{font-size:16px}
  .fav .pic{margin:-12px -12px 10px;border-radius:0}
  .fav .pic .ph{font-size:24px}
  .favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
  .favs::-webkit-scrollbar{display:none}
  .fav{flex:none;width:150px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);text-align:left;overflow:hidden}
  .fav .u{font-size:11px;color:var(--muted)}
  .fav .t{font-weight:700;font-size:14px;line-height:1.4;margin-top:2px}

  /* 問題集ページ */
  .crumb{font-size:12px;color:var(--muted);margin-top:18px}
  .crumb button{color:var(--navy);font-weight:700}
  .book-head{display:flex;align-items:flex-start;gap:12px;margin-top:6px}
  .book-head h1{flex:1;font-size:22px;line-height:1.35;margin:0}
  .star{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:#b8b2a4}
  .star.on{color:var(--gold);border-color:var(--gold)}
  .cov{margin-top:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);font-size:13px}
  .cov span{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
  .kind{margin-top:22px}
  .kind h3{font-size:12px;letter-spacing:.14em;color:var(--navy);margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .kind h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .mat{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;margin-bottom:8px}
  .matrow{display:flex;gap:8px;margin-bottom:8px}
  .matrow .mat{margin-bottom:0;flex:1;min-width:0}
  .mat.done .t{color:var(--muted)}
  .chk{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;color:#c9c3b6;font-size:10px;font-weight:700;letter-spacing:.04em}
  .chk.on{background:var(--gold);border-color:var(--gold);color:#fff}
  .chk:active{transform:scale(.96)}
  .prog{margin-top:14px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
  .prog-t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:8px}
  .prog-t b{font-size:11px;letter-spacing:.08em;color:var(--muted)}
  .prog-t span{font-weight:700;color:var(--navy)}
  .bar{display:block;height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .25s}
  .rp{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--muted);margin-top:6px}
  .rp .bar{width:72px;height:4px}
  .mat:active{background:var(--soft)}
  .mat .ico{flex:none;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--navy);display:flex;align-items:center;justify-content:center}
  .mat .t{flex:1;font-weight:700;font-size:14px;line-height:1.45}
  .mat.locked{cursor:default;-webkit-user-select:none;user-select:none}
  .mat.locked:active{background:#fff}
  .mat.locked .t{color:#8a8578;font-weight:600}
  .mat.locked .ico{background:#f1efe9;color:#b8b2a4}
  .mat.locked .lock svg{margin-left:0}
  .toc-note{margin:14px 2px 0;font-size:12px;line-height:1.7;color:var(--muted)}
  .toc-note svg{color:var(--gold);margin-left:0;vertical-align:-1px}
  .vbtns{display:flex;gap:8px}
  .vbtns .btn{margin:0}
  .vbtns #v-req{flex:0 0 34%}
  .btn.ghost-dark{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);font-size:14px}

  /* 下から出るシート（修正依頼） */
  .sheet{position:fixed;inset:0;z-index:90;background:rgba(15,22,36,.5);display:flex;align-items:flex-end;justify-content:center}
  .sheet[hidden]{display:none}
  .sheet-in{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sheet-h b{font-size:16px;color:var(--navy)}
  .sheet-x{width:40px;height:40px;font-size:22px;color:var(--muted)}
  .req-target{padding:10px 12px;background:var(--soft);border-radius:10px;font-size:13px;line-height:1.5}
  .req-target span{display:block;font-size:11px;color:var(--muted)}
  .fl{display:block;margin-top:14px;font-size:12px;font-weight:700;color:var(--muted)}
  .fl input[type=file]{display:none}
  .fl input:not([type=file]),.fl textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;font-weight:400;color:var(--ink,#1d2433);background:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--navy);background:#fff}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .shots{display:flex;gap:8px;margin-top:6px}
  .shot{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .shot img{width:100%;height:100%;object-fit:cover}
  .shot button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px}
  .addshot{height:42px;font-size:14px;margin-top:8px}
  .req-note{font-size:12px;line-height:1.6;color:var(--muted);margin:14px 2px 0}

  /* ホーム：前回のつづき */
  .resume{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px 14px;background:var(--navy);color:#fff;border-radius:var(--radius);text-align:left}
  .resume .k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--gold)}
  .resume .t{font-weight:700;font-size:14px;line-height:1.45;margin-top:2px}
  .resume .s{font-size:12px;color:#c9d0de;margin-top:1px}
  .resume .main{flex:1;min-width:0}
  .resume .go{flex:none;width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center}
  /* 修正依頼のお知らせ・一覧 */
  .fixnote{margin-top:16px;padding:14px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);border-left:4px solid #2f8f5b}
  .fixnote.no{border-left-color:#9a958a}
  .fixnote .k{font-size:11px;font-weight:700;letter-spacing:.08em;color:#2f8f5b}
  .fixnote.no .k{color:var(--muted)}
  .fixnote .t{font-weight:700;font-size:14px;margin-top:4px;line-height:1.5}
  .fixnote .s{font-size:12px;color:#4a4f5c;margin-top:4px;line-height:1.7;white-space:pre-line}
  .fixnote .acts{display:flex;gap:8px;margin-top:10px}
  .fixnote .acts .btn{height:40px;font-size:13px;margin:0}
  .menu-link{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:14px;font-weight:700;color:var(--navy);text-align:left}
  .st{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
  .st.done{background:#e3f3ea;color:#2f8f5b}
  .st.wait{background:#fdf1d8;color:#9a6b00}
  .st.no{background:#efede8;color:#6f6a5f}
  .reqcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .reqcard .h{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
  .reqcard .t{font-weight:700;font-size:14px;margin-top:4px;line-height:1.5}
  .reqcard .q{font-size:12px;color:#4a4f5c;margin-top:4px;line-height:1.6}
  .reqcard .a{margin-top:8px;padding:8px 10px;background:#f4faf6;border-radius:8px;font-size:12px;line-height:1.6;color:#2b4a39;white-space:pre-line}
  .reqcard .a.no{background:#f7f5f0;color:#4a4f5c}
  .reqcard .a b{display:block;font-size:11px;color:#2f8f5b}
  .reqcard .a.no b{color:var(--muted)}
  .legal{margin:28px 2px 0;font-size:11px;line-height:1.7;color:var(--muted);text-align:center}
  .vnote{margin:0 0 8px;font-size:11px;line-height:1.5;color:#c9d0de;text-align:center}
  .locked-box{margin-top:18px;padding:20px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);text-align:center}
  .locked-box svg{color:var(--gold)}
  .locked-box p{font-size:13px;color:var(--muted);margin:8px 0 4px}

  /* ビューア */
  .viewer{position:fixed;inset:0;z-index:50;background:#2b2f36;display:flex;flex-direction:column}
  .viewer[hidden]{display:none}
  .vbar{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 8px 8px}
  .vbar .back{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
  .vbar .vt{flex:1;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vbody{flex:1;position:relative}
  .vbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .vload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c9d0de;font-size:13px}
  .vfoot{background:var(--navy);padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
  .vfoot .btn{margin:0}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(23,38,66,.94);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .skel{height:58px;border-radius:var(--radius);background:linear-gradient(90deg,#ece8df,#f4f1ea,#ece8df);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}
  .pv{background:#fff3cd;color:#664d03;font-size:12px;text-align:center;padding:6px}
</style>
</head>
<body>
<div class="pv" id="pv" hidden></div>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <button class="brand-name" id="brand" data-go="#/" aria-label="ホームに戻る">THINKING 合格部屋<small>学部別対策ライブラリー</small></button>
      <div class="me" id="me"></div>
    </div>
  </div>
</header>

<div class="sbar" id="sbar" role="search">
  <button class="go" id="fab" type="button" aria-label="大学・学部を検索" aria-expanded="false">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
  <input id="q" type="text" placeholder="大学・学部で検索（例：明治 商）" autocomplete="off" enterkeyhint="search" tabindex="-1" aria-label="大学・学部で検索">
  <button class="close" id="q-clear" type="button" aria-label="検索を閉じる">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<main class="wrap" id="app">
  <div style="margin-top:20px" class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<div class="viewer" id="viewer" hidden>
  <div class="vbar">
    <button class="back" id="v-back" aria-label="閉じる"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vt" id="v-title"></div>
  </div>
  <div class="vbody">
    <div class="vload" id="v-load">読み込み中…</div>
    <iframe id="v-frame" title="PDF" allow="autoplay"></iframe>
  </div>
  <div class="vfoot"><p class="vnote">教材やリンクの共有・転載・譲渡は禁止です。</p>
    <div class="vbtns"><button class="btn ghost-dark" id="v-req">修正を依頼</button><button class="btn gold" id="v-print">印刷・保存する（PDFを開く）</button></div></div>
</div>

<div class="sheet" id="req" hidden role="dialog" aria-modal="true" aria-labelledby="req-h">
  <div class="sheet-in">
    <div class="sheet-h"><b id="req-h">修正を依頼する</b><button class="sheet-x" id="req-x" aria-label="閉じる">×</button></div>
    <div class="req-target" id="req-target"></div>
    <label class="fl">ページ（わかれば）<input id="req-page" inputmode="numeric" maxlength="10" placeholder="例：12"></label>
    <div class="fl">種類<div class="chips" id="req-kind"></div></div>
    <label class="fl">くわしい内容<textarea id="req-text" rows="4" maxlength="2000" placeholder="例：問3の答えが(B)になっていますが、本文の5行目から(C)だと思います。"></textarea></label>
    <div class="fl">写真・スクリーンショット（3枚まで）
      <div class="shots" id="req-shots"></div>
      <label class="btn ghost addshot" id="req-add">写真を選ぶ<input type="file" id="req-file" accept="image/*" multiple hidden></label>
    </div>
    <p class="req-note">送った人の名前と、どの教材かは自動で届きます。確認して、LINEでお返事します。</p>
    <button class="btn gold" id="req-send">送る</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 設定（セットアップ時に2か所だけ埋める）================================ */
var LIFF_ID = "2010454771-UKpPuCeO";   // LINE Developers で作った LIFF ID
var GAS_URL = "https://script.google.com/macros/s/AKfycbwkVjlCL1Q2-0qiLBuR1KSqdubXRdZUFpMydthQCcfkYoCvOhjFqauTKQcu-Bx4Xb8M/exec";   // Apps Script をデプロイした Webアプリの URL（…/exec）
/* ========================================================================= */

var PREVIEW = /[?&]preview=1/.test(location.search);
/* 確認用リンク（?k=キー）：LINEログインなしで、塾生の表示・未購入者の表示を見る。お気に入りは端末の中だけに保存 */
var LINK_KEY = PREVIEW ? "" : decodeURIComponent((location.search.match(/[?&]k=([^&#]+)/) || [])[1] || "");
var CACHE_KEY = LINK_KEY ? "kp.cache.link." + LINK_KEY.slice(0, 6) : "kp.cache.v1";
var RECENT_KEY = "kp.recent.v1";
var TAB_KEY = "kp.tab.v1";

var S = { user: null, cfg: { newDays: 14 }, catalog: null, etag: "", favs: {}, done: {}, reqs: [], idx: null };
var $ = function (id) { return document.getElementById(id); };

/* ---------- 保存（ブラウザ保存が使えない環境でも動くように try で包む） ---------- */
function load(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function persist() {
  if (PREVIEW) return;
  save(CACHE_KEY, { user: S.user, cfg: S.cfg, catalog: S.catalog, etag: S.etag, favs: Object.keys(S.favs), done: Object.keys(S.done), reqs: S.reqs });
}

/* ---------- 起動：前回の内容をすぐ表示 → 裏で最新を取りに行く ---------- */
function start() {
  var c = PREVIEW ? null : load(CACHE_KEY);
  if (c && c.catalog) { applyState(c); render(); }
  if (PREVIEW) { loadScript("mock.js").then(function () { applyState(window.MOCK_BOOT()); render(); showPreviewBar(); }); return; }
  if (!LIFF_ID || !GAS_URL) { renderMessage("準備中", "ポータルの設定がまだ完了していません。"); return; }
  if (LINK_KEY) { syncBoot(); return; }
  loadScript("https://static.line-scdn.net/liff/edge/2/sdk.js")
    .then(function () { return liff.init({ liffId: LIFF_ID }); })
    .then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      return syncBoot();
    })
    .catch(function () {
      if (!S.catalog) renderMessage("LINEから開いてください", "このページはLINEアプリの中で開くと使えます。");
    });
}

function syncBoot() {
  var auth;
  if (LINK_KEY) auth = "key=" + encodeURIComponent(LINK_KEY);
  else {
    var token = idToken();
    if (!token) return;
    auth = "token=" + encodeURIComponent(token);
  }
  return getJSON(GAS_URL + "?action=boot&" + auth + "&etag=" + encodeURIComponent(S.etag || ""))
    .then(function (res) {
      if (res.status === "unauthorized" && LINK_KEY) {
        try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
        S.catalog = null;
        renderMessage("このリンクは使えません", "確認用リンクが変更されたか、停止されています。");
        return;
      }
      if (res.status === "unauthorized") { relogin(); return; }
      if (LINK_KEY) { res.favs = Object.keys(S.favs); res.done = Object.keys(S.done); }
      if (res.status !== "ok") throw new Error(res.reason || "error");
      try { sessionStorage.removeItem("kp.relogin"); } catch (e) {}
      var same = function (a, o) { return JSON.stringify((a || []).slice().sort()) === JSON.stringify(Object.keys(o).sort()); };
      var changed = !!res.catalog || !same(res.favs, S.favs) || !same(res.done, S.done) || JSON.stringify(res.reqs || []) !== JSON.stringify(S.reqs || []) || !S.user || S.user.role !== res.user.role;
      applyState({ user: res.user, cfg: res.cfg, catalog: res.catalog || S.catalog, etag: res.etag, favs: res.favs, done: res.done || [], reqs: res.reqs || [] });
      persist();
      if (changed) render();
      else renderMe();
    })
    .catch(function () { if (!S.catalog) renderMessage("通信できませんでした", "電波の良い場所で、もう一度開いてください。"); });
}

/** 期限切れのIDトークンを送らない（LINE内ブラウザは古いトークンを返すことがある） */
function idToken() {
  try {
    var d = liff.getDecodedIDToken();
    if (!d || d.exp * 1000 < Date.now() + 60000) { relogin(); return ""; }
    return liff.getIDToken();
  } catch (e) { return ""; }
}
function relogin() {
  if (sessionStorage.getItem("kp.relogin")) return;
  try { sessionStorage.setItem("kp.relogin", "1"); } catch (e) {}
  liff.logout();
  liff.login({ redirectUri: location.href });
}

function applyState(o) {
  S.user = o.user || S.user;
  S.cfg = o.cfg || S.cfg;
  if (o.catalog) { S.catalog = o.catalog; S.idx = buildIndex(o.catalog); }
  S.etag = o.etag || S.etag;
  if (o.favs) { S.favs = {}; o.favs.forEach(function (id) { S.favs[id] = true; }); }
  if (o.done) { S.done = {}; o.done.forEach(function (f) { S.done[f] = true; }); }
  if (o.reqs) S.reqs = o.reqs;
}

/* ---------- 一覧の索引 ---------- */
function buildIndex(cat) {
  var books = {}, items = {}, unis = {}, order = [];
  cat.books.forEach(function (b) {
    b.hay = norm([b.g, b.u, b.uy, b.n, b.cov, b.kw].join(" "));
    books[b.id] = b;
    var key = b.g + "\u0000" + b.u;
    if (!unis[key]) { unis[key] = { g: b.g, u: b.u, uy: b.uy, books: [] }; order.push(key); }
    unis[key].books.push(b);
  });
  cat.items.forEach(function (it) { (items[it.b] = items[it.b] || []).push(it); });
  return { books: books, items: items, unis: order.map(function (k) { return unis[k]; }) };
}

/** 全角/半角・カタカナ/ひらがな・空白の違いを吸収して検索する */
function norm(s) {
  return String(s || "").normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); })
    .replace(/[\s・,、。.\-‐_/()（）「」]/g, "");
}

/* ---------- 画面 ---------- */
function render() {
  renderMe();
  var q = $("q").value.trim();
  if (q) return renderSearch(q);
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/");
  if (parts[0] === "b" && parts[1]) return renderBook(decodeURIComponent(parts[1]));
  if (parts[0] === "reqs") return renderReqs();
  if (parts[0] === "u" && parts[1]) return renderUni(decodeURIComponent(parts[1]));
  renderHome();
}

function renderMe() {
  if (!S.user) return;
  var label = { student: "塾生", buyer: "購入者", guest: "ゲスト", staff: "スタッフ" }[S.user.role] || "";
  $("me").textContent = (S.user.name ? S.user.name + " ・ " : "") + label;
  if (S.user.link) {
    $("pv").hidden = false;
    $("pv").textContent = "確認用リンクで表示中（" + (S.user.role === "guest" ? "未購入者" : "塾生") + "の画面）";
  }
}

function renderHome(keepScroll) {
  if (!S.idx) return;
  var html = topHero();
  html += '<p class="lead">過去5年の入試を<b>1問残らず解いて分析</b>し、学部ごとの出題を<b>オリジナル問題で再現</b>した対策教材が、ここにそろっています。</p>';
  html += roleNotice();
  html += fixNotice();
  html += resumeCard();
  if ((S.reqs || []).length) html += '<button class="menu-link" data-go="#/reqs">送った修正依頼（' + S.reqs.length + "件）" + chev() + "</button>";

  var favs = Object.keys(S.favs).map(function (id) { return S.idx.books[id]; }).filter(Boolean);
  if (favs.length) html += '<h2 class="sec">お気に入り</h2><div class="favs">' + favs.map(favCard).join("") + "</div>";

  var recent = (load(RECENT_KEY) || []).map(function (id) { return S.idx.books[id]; }).filter(Boolean).filter(function (b) { return !S.favs[b.id]; });
  if (recent.length) html += '<h2 class="sec">最近見た問題集</h2><div class="list">' + recent.slice(0, 4).map(bookRowThumb).join("") + "</div>";

  var groups = S.catalog.groups.filter(function (g) { return S.idx.unis.some(function (u) { return u.g === g; }); });
  S.idx.unis.forEach(function (u) { if (groups.indexOf(u.g) < 0) groups.push(u.g); });
  var tab = load(TAB_KEY);
  if (groups.indexOf(tab) < 0) tab = groups[0];
  html += '<h2 class="sec">大学から探す</h2>';
  html += '<div class="tabs" role="tablist">' + groups.map(function (g) {
    return '<button class="tab' + (g === tab ? " on" : "") + '" data-tab="' + esc(g) + '">' + esc(g) + "</button>";
  }).join("") + "</div>";
  html += '<div class="unis">' + S.idx.unis.filter(function (u) { return u.g === tab; }).map(function (u) {
    var n = u.books.length;
    return '<button class="uni" data-uni="' + esc(u.u) + '">' + pic(u.u, 400) + '<span class="ub"><span class="t" style="display:block">' + esc(u.u) + '</span><span class="s" style="display:block">' + n + "冊</span></span></button>";
  }).join("") + "</div>";

  html += legalNote();
  var y = window.scrollY;
  $("app").innerHTML = html;
  window.scrollTo(0, keepScroll ? y : 0);
  prefetchPics();
}

/* ---------- 前回のつづき（最後に開いた教材。端末の中だけに覚える） ---------- */
var LAST_KEY = "kp.last.v1";
function resumeCard() {
  var last = load(LAST_KEY);
  if (!last || !S.idx) return "";
  var list = S.idx.items[last.b] || [];
  var i = -1;
  list.forEach(function (it, n) { if (it.f && it.f === last.f && !it.L) i = n; });
  var b = S.idx.books[last.b];
  if (i < 0 || !b) return "";
  return '<button class="resume" data-item="' + esc(b.id) + ":" + i + '"><span class="main"><span class="k" style="display:block">前回のつづき</span>'
    + '<span class="t" style="display:block">' + esc(list[i].t) + '</span><span class="s" style="display:block">' + esc(b.n) + "</span></span>"
    + '<span class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span></button>';
}

/* ---------- 修正依頼（どの教材か・だれからかは自動。写真は送る前に端末で小さくする） ---------- */
var REQ_KINDS = ["誤字・脱字", "答えが違う", "解説が分かりにくい", "表示されない", "その他"];
var REQ = { item: null, kind: "", shots: [] };
$("v-req").addEventListener("click", function () {
  if (!CUR) return;
  var b = S.idx.books[CUR.b] || {};
  REQ = { item: CUR, kind: "", shots: [] };
  $("req-target").innerHTML = "<span>この教材について送ります</span>" + esc(b.n || "") + "／" + esc(CUR.t);
  $("req-page").value = "";
  $("req-text").value = "";
  $("req-kind").innerHTML = REQ_KINDS.map(function (k) { return '<button class="chip" data-kind="' + esc(k) + '">' + esc(k) + "</button>"; }).join("");
  paintShots();
  $("req").hidden = false;
});
$("req-x").addEventListener("click", function () { $("req").hidden = true; });
$("req-kind").addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-kind]");
  if (!el) return;
  REQ.kind = el.dataset.kind;
  Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle("on", c === el); });
});
$("req-file").addEventListener("change", function () {
  var files = Array.prototype.slice.call(this.files || [], 0, 3 - REQ.shots.length);
  this.value = "";
  files.forEach(function (f) {
    shrinkImage(f).then(function (dataUrl) { REQ.shots.push(dataUrl); paintShots(); }).catch(function () { toast("この写真は読み込めませんでした"); });
  });
});
function paintShots() {
  $("req-shots").innerHTML = REQ.shots.map(function (u, i) { return '<div class="shot"><img alt="" src="' + u + '"><button data-shot="' + i + '" aria-label="外す">×</button></div>'; }).join("");
  $("req-add").style.display = REQ.shots.length >= 3 ? "none" : "";
}
$("req-shots").addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-shot]");
  if (!el) return;
  REQ.shots.splice(Number(el.dataset.shot), 1);
  paintShots();
});
/** 長い辺を1280pxまでに縮めて JPEG にする（1枚200KBほど） */
function shrinkImage(file) {
  return new Promise(function (ok, ng) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var r = Math.min(1, 1280 / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = function () { URL.revokeObjectURL(url); ng(); };
    img.src = url;
  });
}
$("req-send").addEventListener("click", function () {
  var text = $("req-text").value.trim();
  if (!text && !REQ.shots.length) return toast("内容か写真を入れてください");
  if (!REQ.kind) return toast("種類を選んでください");
  if (PREVIEW) { $("req").hidden = true; return toast("（プレビューのため送っていません）"); }
  if (LINK_KEY) return toast("確認用リンクからは送れません。LINEから開いてください");
  var btn = this;
  btn.disabled = true;
  btn.textContent = "送っています…";
  post({ action: "report", token: idToken(), book: REQ.item.b, file: REQ.item.f, page: $("req-page").value.trim(), kind: REQ.kind, text: text,
    photos: REQ.shots.map(function (u) { return u.split(",")[1]; }) }).then(function (res) {
    if (res && res.status === "ok") { $("req").hidden = true; toast("送りました。確認してLINEでお返事します"); return; }
    toast(res && res.reason === "limit" ? "今日はこれ以上送れません。明日またお願いします" : "送れませんでした。もう一度お試しください");
  }).catch(function () { toast("送れませんでした。電波の良い場所でもう一度お試しください"); })
    .then(function () { btn.disabled = false; btn.textContent = "送る"; });
});

/* ---------- 修正依頼の結果（運営が「状態」と「生徒へのひとこと」を入れると出る） ---------- */
var REQ_SEEN_KEY = "kp.reqseen.v1";
var REQ_STATE = { done: "修正しました", wait: "確認中", no: "このままにします" };
/** ホームの上：まだ見ていない「修正しました／このままにします」を1件出す */
function fixNotice() {
  var seen = load(REQ_SEEN_KEY) || [];
  var fresh = (S.reqs || []).filter(function (r) { return r.s !== "wait" && seen.indexOf(r.id) < 0; });
  if (!fresh.length) return "";
  var r = fresh[0];
  var it = findItemByFile(r.f);
  var body = r.d + "に送ってもらった「" + r.k + (r.p ? "（" + r.p + "ページ）" : "") + "」" + (r.s === "done" ? "を直しました。ありがとうございます！" : "について確認しました。")
    + (r.r ? "\n" + r.r : "");
  return '<div class="fixnote' + (r.s === "no" ? " no" : "") + '"><div class="k">' + (r.s === "done" ? "✔ 修正しました" : "確認しました") + (fresh.length > 1 ? "（ほかに" + (fresh.length - 1) + "件）" : "") + "</div>"
    + '<div class="t">' + esc(r.b) + "／" + esc(r.t) + '</div><div class="s">' + esc(body) + "</div>"
    + '<div class="acts">' + (it && r.s === "done" ? '<button class="btn gold" data-reqopen="' + esc(r.id) + '">直った教材を開く</button>' : "")
    + '<button class="btn ghost" data-reqseen="' + esc(r.id) + '">閉じる</button></div></div>';
}
function findItemByFile(f) {
  if (!f || !S.idx) return null;
  for (var b in S.idx.items) {
    var list = S.idx.items[b];
    for (var i = 0; i < list.length; i++) if (list[i].f === f && !list[i].L) return { b: b, i: i };
  }
  return null;
}
function markReqSeen(id) {
  var seen = (load(REQ_SEEN_KEY) || []).filter(function (x) { return x !== id; });
  seen.push(id);
  save(REQ_SEEN_KEY, seen.slice(-60));
}
function renderReqs() {
  var html = '<div class="crumb"><button data-go="#/">ホーム</button> › 送った修正依頼</div><div class="book-head"><h1 style="font-size:20px">送った修正依頼</h1></div><div style="margin-top:12px">';
  (S.reqs || []).forEach(function (r) {
    markReqSeen(r.id);
    html += '<div class="reqcard"><div class="h"><span>' + esc(r.d) + ' 送信</span><span class="st ' + r.s + '">' + REQ_STATE[r.s] + "</span></div>"
      + '<div class="t">' + esc(r.b) + "／" + esc(r.t) + '</div><div class="q">' + esc(r.k) + (r.p ? "・" + esc(r.p) + "ページ" : "") + (r.x ? "：" + esc(r.x) : "") + "</div>"
      + (r.r ? '<div class="a' + (r.s === "no" ? " no" : "") + '"><b>THINKINGより</b>' + esc(r.r) + "</div>" : "") + "</div>";
  });
  if (!(S.reqs || []).length) html += '<div class="empty">まだ送った修正依頼はありません。</div>';
  $("app").innerHTML = html + "</div>";
  window.scrollTo(0, 0);
}

function legalNote() {
  return '<p class="legal">教材やリンクの共有・転載・譲渡は禁止です。違反が確認された場合は、法的措置をとることがあります。© THINKING</p>';
}

function roleNotice() {
  var r = S.user && S.user.role;
  if (r === "guest") {
    return '<div class="notice"><b>サンプルの問題集を公開中です</b>THINKINGの塾生は、THINKING CAMPUSで登録するとすべての問題集を見られます。購入した方は、ご購入の確認後に開けるようになります。'
      + '<a class="btn ghost" href="' + esc(S.cfg.campusUrl || "#") + '">THINKING CAMPUS で登録する</a>'
      + '<a class="btn" href="' + esc(S.cfg.buyUrl || "#") + '">購入・お問い合わせ（LINE）</a></div>';
  }
  return "";
}

function favCard(b) {
  return '<button class="fav" data-book="' + esc(b.id) + '">' + pic(b.u, 320) + '<div class="u">' + esc(b.u) + '</div><div class="t">' + esc(shortName(b)) + (b.L ? lockIcon(14) : "") + "</div></button>";
}

function bookRow(b) { return bookRowOf(b, false); }
function bookRowThumb(b) { return bookRowOf(b, true); }
function bookRowOf(b, thumb) {
  var tags = (b.s ? '<span class="tag sample">サンプル</span>' : "") + (b.L && (S.idx.items[b.id] || []).some(function (it) { return !it.L; }) ? '<span class="tag sample">一部無料</span>' : "") + (b.h ? '<span class="tag hidden">非公開</span>' : "") + (hasNew(b.id) ? '<span class="tag new">NEW</span>' : "");
  return '<button class="row" data-book="' + esc(b.id) + '">' + (thumb ? pic(b.u, 160, "thumb") : "") + '<div class="main"><div class="t">' + esc(b.n) + tags + "</div>"
    + (b.cov ? '<div class="s">' + esc(b.cov) + "</div>" : "") + rowProgress(b) + "</div>"
    + (b.L ? '<span class="lock">' + lockIcon(18) + "</span>" : chev()) + "</button>";
}

function rowProgress(b) {
  var p = progressOf(b.id);
  if (!p.done) return "";
  return '<div class="rp"><span class="bar"><i style="width:' + Math.round(p.done / p.total * 100) + '%"></i></span>' + p.done + " / " + p.total + "</div>";
}

function shortName(b) {
  return b.n.indexOf(b.u) === 0 && b.n.length > b.u.length ? b.n.slice(b.u.length).trim() : b.n;
}

function renderUni(name) {
  if (!S.idx) return;
  var u = S.idx.unis.filter(function (x) { return x.u === name; })[0];
  if (!u) return renderHome();
  if (u.books.length === 1) { location.replace("#/b/" + encodeURIComponent(u.books[0].id)); return; }
  $("app").innerHTML = '<div class="crumb"><button data-go="#/">ホーム</button> › ' + esc(u.g) + "</div>"
    + pic(u.u, 1200, "hero")
    + '<div class="book-head"><h1>' + esc(u.u) + "</h1></div>"
    + (uniInfo(u.u).c ? '<p class="uni-note">' + esc(uniInfo(u.u).c) + "</p>" : "")
    + '<h2 class="sec">問題集（' + u.books.length + "冊）</h2>"
    + '<div class="list">' + u.books.map(bookRow).join("") + "</div>";
  window.scrollTo(0, 0);
}

function renderBook(id) {
  if (!S.idx) return;
  var b = S.idx.books[id];
  if (!b) return renderHome();
  pushRecent(b.id);   // 問題集のページを開いたら「最近見た問題集」に入れる（教材を開かなくても）
  logOnce("book", b.id, b.n);
  var html = '<div class="crumb"><button data-go="#/">ホーム</button> › <button data-uni="' + esc(b.u) + '">' + esc(b.u) + "</button></div>";
  html += '<div class="book-head">' + pic(b.u, 240, "bthumb") + '<h1>' + esc(b.n) + (b.s ? '<span class="tag sample">サンプル</span>' : "") + (b.h ? '<span class="tag hidden">非公開</span>' : "") + "</h1>"
    + '<button class="star' + (S.favs[b.id] ? " on" : "") + '" data-fav="' + esc(b.id) + '" aria-label="お気に入り">' + starIcon(!!S.favs[b.id]) + "</button></div>";
  if (b.cov) html += '<div class="cov"><span>この1冊で対応する入試</span>' + esc(b.cov) + "</div>";

  // ロック中でも目次（区分・タイトル）は見せる。鍵の付いた教材は押しても開かない
  var items = S.idx.items[b.id] || [];
  var nLocked = items.filter(function (it) { return it.L; }).length;
  if (b.L && items.length) html += '<p class="toc-note">' + lockIcon(13) + " この問題集の全" + items.length + "点の構成です。" + (nLocked < items.length ? "「無料」の教材はすぐに読めます。" : "") + "鍵の付いた教材は、塾生・購入者限定です。</p>";
  if (!items.length) html += '<div class="empty">教材を準備中です。</div>';
  html += progressBox(b.id);
  S.catalog.kinds.forEach(function (k) {
    var list = items.filter(function (it) { return it.k === k; });
    if (!list.length) return;
    html += '<section class="kind"><h3>' + esc(k) + "</h3>" + list.map(function (it) {
      return it.L ? lockedRow(it) : matButton(b.id, items.indexOf(it), it, b.L);
    }).join("") + "</section>";
  });
  if (b.L) {
    var sample = S.catalog.books.filter(function (x) { return x.s && !x.L; })[0];
    html += '<div class="locked-box">' + lockIcon(28) + "<p>鍵の付いた教材は、塾生・購入者限定です。</p>"
      + '<a class="btn gold" href="' + esc(S.cfg.buyUrl || "#") + '">購入・お問い合わせ（LINE）</a>'
      + (sample ? '<button class="btn ghost" data-book="' + esc(sample.id) + '">サンプル（' + esc(sample.n) + "）を見る</button>" : "")
      + "</div>";
  }
  html += legalNote();
  $("app").innerHTML = html;
  window.scrollTo(0, 0);
}

function matButton(bookId, i, it, freeTag) {
  var done = !!S.done[it.f];
  return '<div class="matrow"><button class="mat' + (done ? " done" : "") + '" data-item="' + esc(bookId) + ":" + i + '"><span class="ico">' + docIcon() + '</span><span class="t">' + esc(it.t)
    + (freeTag ? '<span class="tag sample">無料</span>' : "") + (isNew(it) ? '<span class="tag new">NEW</span>' : "") + (it.h ? '<span class="tag hidden">非公開</span>' : "") + "</span>" + chev() + "</button>"
    + '<button class="chk' + (done ? " on" : "") + '" data-done="' + esc(bookId) + ":" + i + '" role="checkbox" aria-checked="' + done + '" aria-label="やった">' + checkIcon() + '<span>やった</span></button></div>';
}

/* ---------- 「やった」チェックと進み具合 ---------- */
/** 開ける教材のうち、チェックした数 */
function progressOf(bookId) {
  var open = (S.idx.items[bookId] || []).filter(function (it) { return !it.L && it.f; });
  return { done: open.filter(function (it) { return S.done[it.f]; }).length, total: open.length };
}
function progressBox(bookId) {
  var p = progressOf(bookId);
  if (!p.total) return "";
  var pct = Math.round(p.done / p.total * 100);
  return '<div class="prog" id="prog"><div class="prog-t"><b>進み具合</b><span>' + p.done + " / " + p.total + (p.done === p.total ? "　ぜんぶやった！" : "") + "</span></div>"
    + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
}
function toggleDone(key, el) {
  var p = key.split(":"), bookId = p[0], it = (S.idx.items[bookId] || [])[Number(p[1])];
  if (!it || !it.f) return;
  var on = !S.done[it.f];
  if (on) S.done[it.f] = true; else delete S.done[it.f];
  var paint = function () {
    el.classList.toggle("on", !!S.done[it.f]);
    el.setAttribute("aria-checked", String(!!S.done[it.f]));
    el.previousSibling.classList.toggle("done", !!S.done[it.f]);
    var box = $("prog");
    if (box) box.outerHTML = progressBox(bookId);
  };
  paint();
  persist();
  if (PREVIEW || LINK_KEY) return;
  post({ action: "done", token: idToken(), book: bookId, file: it.f, title: it.t, on: on }).then(function (res) {
    if (!res || res.status !== "ok") throw new Error();
  }).catch(function () {
    if (on) delete S.done[it.f]; else S.done[it.f] = true;
    paint(); persist();
    toast("保存できませんでした。もう一度お試しください。");
  });
}
function checkIcon() { return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'; }

/* ---------- 利用状況の記録（運営の「利用状況」シート用。画面は待たない） ---------- */
var LOGGED = {};
function logOnce(kind, book, title) {
  if (PREVIEW || LINK_KEY || !window.liff) return;
  var k = kind + ":" + book + ":" + title;
  if (LOGGED[k]) return;
  LOGGED[k] = 1;
  var token = idToken();
  if (token) post({ action: "log", token: token, kind: kind, book: book, title: title }).catch(function () {});
}
/** 鍵の付いた教材：タイトルだけ見せて、押しても何も起きない */
function lockedRow(it) {
  return '<div class="mat locked" aria-disabled="true"><span class="ico">' + docIcon() + '</span><span class="t">' + esc(it.t)
    + (isNew(it) ? '<span class="tag new">NEW</span>' : "") + '</span><span class="lock" aria-label="塾生・購入者限定">' + lockIcon(18) + "</span></div>";
}

var missTimer = 0;
function renderSearch(q) {
  if (!S.idx) return;
  var tokens = q.split(/\s+/).map(norm).filter(Boolean);
  var hits = S.catalog.books.filter(function (b) { return tokens.every(function (t) { return b.hay.indexOf(t) >= 0; }); });
  // 見つからなかった言葉は、打ち終わって1.5秒たってから記録する（打っている途中の文字は送らない）
  clearTimeout(missTimer);
  if (!hits.length) missTimer = setTimeout(function () { if ($("q").value.trim() === q) logOnce("search0", "", q); }, 1500);
  $("app").innerHTML = '<h2 class="sec">「' + esc(q) + "」の検索結果（" + hits.length + "件）</h2>"
    + (hits.length ? '<div class="list">' + hits.map(function (b) { return bookRowThumb(b).replace('<div class="t">', '<div class="t"><span style="font-weight:500;color:var(--muted);font-size:12px;display:block">' + esc(b.u) + "</span>"); }).join("") + "</div>"
      : '<div class="empty">見つかりませんでした。大学名だけ（例：明治）で検索してみてください。</div>');
}

function renderMessage(title, body) {
  $("app").innerHTML = '<div class="notice"><b>' + esc(title) + "</b>" + esc(body) + "</div>";
}

/* ---------- 操作 ---------- */
document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-book],[data-uni],[data-go],[data-tab],[data-fav],[data-item],[data-done],[data-reqseen],[data-reqopen]");
  if (!el) return;
  var d = el.dataset;
  if (d.reqseen) { markReqSeen(d.reqseen); return renderHome(true); }
  if (d.reqopen) {
    var r = (S.reqs || []).filter(function (x) { return x.id === d.reqopen; })[0];
    var at = r && findItemByFile(r.f);
    markReqSeen(d.reqopen);
    renderHome(true);
    if (at) openItem(at.b, at.i);
    return;
  }
  if (d.fav) return toggleFav(d.fav, el);
  if (d.done) return toggleDone(d.done, el);
  if (d.item) { var p = d.item.split(":"); return openItem(p[0], Number(p[1])); }
  if (d.tab) { save(TAB_KEY, d.tab); return renderHome(true); }
  clearSearch();
  if (d.book) location.hash = "#/b/" + encodeURIComponent(d.book);
  else if (d.uni) location.hash = "#/u/" + encodeURIComponent(d.uni);
  else if (d.go) {
    // すでにホームにいるとき（ロゴを押したとき）は、いちばん上に戻す
    if (location.hash.replace(/^#\/?/, "") === d.go.replace(/^#\/?/, "")) { render(); window.scrollTo(0, 0); }
    else location.hash = d.go;
  }
});
window.addEventListener("hashchange", function () { if (!$("viewer").hidden) closeViewer(true); render(); });

var qTimer = 0;
$("q").addEventListener("input", function () {
  clearTimeout(qTimer);
  qTimer = setTimeout(render, 60);
});
$("q").addEventListener("keydown", function (e) { if (e.key === "Enter") this.blur(); });
$("q-clear").addEventListener("click", function (e) { e.preventDefault(); clearSearch(); render(); });
function clearSearch() { $("q").value = ""; setSearchOpen(false); }
/** 右下の虫眼鏡：押すと左へ横に伸びて検索窓になり、すぐ入力できる。× で閉じて元の画面に戻る */
function setSearchOpen(on) {
  $("sbar").classList.toggle("open", on);
  $("fab").setAttribute("aria-expanded", on ? "true" : "false");
  $("q").tabIndex = on ? 0 : -1;
  if (!on) $("q").blur();
}
$("fab").addEventListener("click", function () {
  if ($("sbar").classList.contains("open")) return;
  setSearchOpen(true);
  $("q").focus(); // キーボードを出すため、押した操作の中ですぐにフォーカスする
});
/* キーボードが出たら、検索窓をキーボードのすぐ上に持ち上げる（LINE内ブラウザで隠れないように） */
if (window.visualViewport) {
  var fitKb = function () {
    var vv = window.visualViewport;
    var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb", kb + "px");
  };
  window.visualViewport.addEventListener("resize", fitKb);
  window.visualViewport.addEventListener("scroll", fitKb);
}

function toggleFav(id, el) {
  var on = !S.favs[id];
  if (on) S.favs[id] = true; else delete S.favs[id];
  el.classList.toggle("on", on);
  el.innerHTML = starIcon(on);
  toast(on ? "お気に入りに追加しました" : "お気に入りから外しました");
  persist();
  if (PREVIEW || LINK_KEY) return;
  post({ action: "fav", token: idToken(), book: id, on: on }).then(function (res) {
    if (!res || res.status !== "ok") throw new Error();
  }).catch(function () {
    if (on) delete S.favs[id]; else S.favs[id] = true;
    persist(); render();
    toast("保存できませんでした。もう一度お試しください。");
  });
}

/* ---------- ビューア（Googleドライブのプレビューを埋め込み） ---------- */
var CUR = null;
function openItem(bookId, i) {
  var it = (S.idx.items[bookId] || [])[i];
  if (!it) return;
  CUR = it;
  if (it.f) save(LAST_KEY, { b: bookId, f: it.f });
  $("v-title").textContent = it.t;
  $("v-load").hidden = false;
  $("v-frame").src = "about:blank";
  $("viewer").hidden = false;
  document.body.style.overflow = "hidden";
  history.pushState({ viewer: 1 }, "");
  if (PREVIEW || /^mock/.test(it.f)) {
    $("v-load").textContent = "（プレビューのため、実際のPDFは表示されません）";
  } else {
    $("v-load").textContent = "読み込み中…";
    $("v-frame").src = "https://drive.google.com/file/d/" + it.f + "/preview";
    if (!LINK_KEY) post({ action: "log", token: idToken(), kind: "view", book: bookId, title: it.t }).catch(function () {});
  }
}
$("v-frame").addEventListener("load", function () { if (this.src !== "about:blank") $("v-load").hidden = true; });
$("v-back").addEventListener("click", function () { history.back(); });
window.addEventListener("popstate", function () { if (!$("viewer").hidden) closeViewer(true); });
function closeViewer(fromHistory) {
  $("viewer").hidden = true;
  $("v-frame").src = "about:blank";
  document.body.style.overflow = "";
  CUR = null;
}
/** 印刷・保存は端末のブラウザでPDFそのものを開く（LINE内ブラウザでは印刷できないため） */
$("v-print").addEventListener("click", function () {
  if (!CUR) return;
  if (PREVIEW || /^mock/.test(CUR.f)) return toast("プレビューでは開けません");
  var url = "https://drive.google.com/uc?export=download&id=" + CUR.f;
  if (window.liff && liff.isInClient && liff.isInClient()) liff.openWindow({ url: url, external: true });
  else window.open(url, "_blank", "noopener");
});

function pushRecent(id) {
  var r = (load(RECENT_KEY) || []).filter(function (x) { return x !== id; });
  r.unshift(id);
  save(RECENT_KEY, r.slice(0, 8));
}

var PIC_SIZES = { hero: "(max-width: 560px) 100vw, 560px", thumb: "64px", bthumb: "88px", "": "(max-width: 560px) 50vw, 280px" };
function uniInfo(name) { return (S.catalog && S.catalog.unis && S.catalog.unis[name]) || {}; }
/** 大学の画像（16:9）。画像が未登録・読み込み失敗のときは同じ大きさの枠に頭文字を薄く出す（レイアウトは崩れない） */
/**
 * 一度読み込んだ画像は覚えておき、画面を切り替えて描き直すときはふわっと出さずにそのまま出す
 * （毎回フェードすると、切り替えのたびに画像が一瞬消えて見えるため）。端末にも残して次に開いたときも同じ。
 */
var PIC_SEEN = (function () { var o = {}; (load("kp.pics.v1") || []).forEach(function (k) { o[k] = 1; }); return o; })();
function picOk(img) {
  img.classList.add("ok");
  markSeen(img.getAttribute("src"));
}
function markSeen(k) {
  if (PIC_SEEN[k]) return;
  PIC_SEEN[k] = 1;
  save("kp.pics.v1", Object.keys(PIC_SEEN).slice(-80));
}

/** ホームを出したあと、手が空いたときに全大学のカード用の画像を先に読んでおく（タブを切り替えたときにすぐ出るように） */
var PREFETCHED = false;
function prefetchPics() {
  if (PREFETCHED || !S.idx) return;
  PREFETCHED = true;
  var run = function () {
    S.idx.unis.forEach(function (u) {
      var id = uniInfo(u.u).i, slug = UNI_IMG[u.u];
      var src = id ? (/^data:/.test(id) ? "" : "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w400") : slug ? "img/uni/" + slug + "-640.webp" : "";
      if (!src || PIC_SEEN[src]) return;
      var im = new Image();
      im.decoding = "async";
      im.onload = function () { markSeen(src); };
      im.src = src;
    });
  };
  if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 2500 }); else setTimeout(run, 1200);
}

function pic(uni, w, cls) {
  var id = uniInfo(uni).i, slug = UNI_IMG[uni], src = "", set = "";
  if (id) src = /^data:/.test(id) ? id : "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w" + w;
  else if (slug) { src = "img/uni/" + slug + "-640.webp"; set = "img/uni/" + slug + "-640.webp 640w, img/uni/" + slug + "-1280.webp 1280w"; }
  var ph = String(uni || "").replace(/大学$/, "").charAt(0);
  // 本物の画像が届くまで、ぼかしの下絵（PIC_LQ）を敷いておく。下絵がない大学は頭文字の枠
  var lq = !id && slug && PIC_LQ[slug];
  return '<span class="pic' + (cls ? " " + cls : "") + '" aria-hidden="true">'
    + (lq ? '<span class="lq" style="background-image:url(' + lq + ')"></span>' : '<span class="ph">' + esc(ph) + "</span>")
    + (src ? '<img src="' + esc(src) + '"' + (set ? ' srcset="' + set + '" sizes="' + PIC_SIZES[cls || ""] + '"' : "")
      + (PIC_SEEN[src] ? ' class="ok" alt="" decoding="sync"' : ' alt="" loading="lazy" decoding="async"') + ' onload="picOk(this)" onerror="this.remove()">' : "")
    + "</span>";
}

/* ---------- 補助 ---------- */
function hasNew(bookId) { return (S.idx.items[bookId] || []).some(isNew); }
function isNew(it) {
  if (!it.d) return false;
  var days = (Date.now() - new Date(it.d + "T00:00:00+09:00").getTime()) / 86400000;
  return days <= (S.cfg.newDays || 14);
}
function getJSON(url) { return fetch(url).then(function (r) { return r.json(); }); }
/* Content-Type を付けない（text/plain のまま）。付けると CORS の事前確認で GAS が失敗する */
function post(body) { return fetch(GAS_URL, { method: "POST", body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
function loadScript(src) {
  return new Promise(function (ok, ng) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ng; document.head.appendChild(s); });
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
var tt = 0;
function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("show"); }, 1800); }
function chev() { return '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'; }
function lockIcon(n) { return '<svg width="' + n + '" height="' + n + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px;margin-left:4px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'; }
function starIcon(on) { return '<svg width="22" height="22" viewBox="0 0 24 24" fill="' + (on ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>'; }
function docIcon() { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>'; }
function showPreviewBar() {
  var role = (location.search.match(/[?&]role=(\w+)/) || [])[1] || "student";
  var bar = $("pv");
  bar.hidden = false;
  bar.innerHTML = "プレビュー表示（" + esc(role) + "）： "
    + ["student", "buyer", "guest", "staff"].map(function (r) { return '<a style="text-decoration:underline;margin:0 4px" href="?preview=1&role=' + r + location.hash + '">' + r + "</a>"; }).join("");
}

start();
</script>
