<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>共通テスト英語R 可視化リーディング｜THINKING</title>
<meta name="description" content="共通テスト英語リーディングの大問別・可視化リーディング。残り日数、補助教材、各大問の問題と解説をここから開けます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#16315f; --blue:#2457d6; --yellow:#ffe56a; --ink:#1a2744; --muted:#5c6b82;
  --line:#e3eaf3; --paper:#fff; --bg:#eef3f9; --soft:#f6f8fc;
}
html{scroll-behavior:smooth;}
body{font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;}
img{max-width:100%;display:block;}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 80px;}
.hero{width:100%;height:auto;border-radius:22px;background:#e7eef8;}
.map{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.map a{display:flex;flex-direction:column;gap:2px;min-height:72px;padding:10px 10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--navy);}
.map a:focus-visible,.btn:focus-visible,.step:focus-visible{outline:3px solid rgba(36,87,214,.45);outline-offset:2px;}
.map small{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.04em;}
.map b{font-size:13px;line-height:1.35;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px;margin-top:14px;}
.sec-no{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--blue);}
h1{font-size:26px;line-height:1.25;margin:2px 0 4px;}
.when{font-size:13px;color:var(--muted);}
.count{display:flex;align-items:flex-end;gap:6px;margin-top:14px;}
.count b{font-size:64px;line-height:.85;font-weight:900;letter-spacing:-.05em;color:var(--navy);font-variant-numeric:tabular-nums;}
.count span{font-size:20px;font-weight:900;padding-bottom:8px;}
.subtime{margin-top:6px;font-size:15px;font-weight:700;color:var(--navy);}
.hours{margin-top:16px;padding:14px;background:var(--soft);border-radius:16px;}
.hours p{font-size:13px;font-weight:700;}
.stepper{display:flex;align-items:center;gap:8px;margin-top:8px;}
.step{width:48px;height:48px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:24px;font-weight:700;line-height:1;cursor:pointer;}
.step:active{transform:translateY(1px);}
.hours input{width:92px;height:48px;border:1.5px solid var(--line);border-radius:14px;background:#fff;text-align:center;font:inherit;font-size:22px;font-weight:900;color:var(--navy);}
.unit{font-size:14px;font-weight:700;}
.study{margin-top:12px;font-size:15px;}
.study b{display:inline-block;margin:0 2px;font-size:32px;line-height:1;letter-spacing:-.04em;color:var(--navy);font-variant-numeric:tabular-nums;}
.hint{margin-top:6px;font-size:12px;color:var(--muted);}
.book{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;}
.book img{width:min(240px,72vw);height:auto;border-radius:8px;box-shadow:0 14px 32px rgba(22,49,95,.2);}
.book > div{width:100%;}
.book h2{font-size:20px;line-height:1.45;margin:0 0 8px;}
.book .meta{font-size:13px;color:var(--muted);margin-bottom:12px;}
.group{margin-top:16px;}
.group h3{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;}
.stack{display:flex;flex-direction:column;gap:8px;}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 14px;border-radius:16px;text-decoration:none;font-weight:700;border:1.5px solid transparent;}
.btn .t{display:flex;flex-direction:column;align-items:flex-start;gap:1px;}
.btn .t b{font-size:15px;line-height:1.3;}
.btn .t small{font-size:12px;font-weight:500;}
.btn .go{font-size:18px;line-height:1;}
.btn.video{background:var(--navy);color:#fff;}
.btn.video small{color:rgba(255,255,255,.75);}
.btn.slide{background:#fff;color:var(--navy);border-color:var(--navy);}
.btn.slide small{color:var(--muted);}
.paper{padding:14px;border:1px solid var(--line);border-radius:18px;background:#fff;}
.paper + .paper{margin-top:10px;}
.paper header{margin-bottom:10px;}
.year{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--navy);background:var(--yellow);border-radius:999px;padding:3px 8px;}
.paper h3{font-size:17px;margin-top:6px;line-height:1.35;}
.paper .topic{font-size:13px;color:var(--muted);}
.pair{display:grid;grid-template-columns:1fr 1.15fr;gap:8px;}
.pair a,.pair span{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;font-size:15px;font-weight:900;text-decoration:none;text-align:center;padding:8px;}
.pair .problem{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
.pair .explain{background:var(--yellow);color:var(--navy);}
.pair .wait{background:#f3f5f8;color:#8b97a8;border:1.5px solid #e6ebf2;}
.later{margin-top:14px;}
.later h2{font-size:18px;}
.later .lead{font-size:13px;color:var(--muted);margin:4px 0 12px;}
.weeks{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.week{padding:12px 12px 10px;border-radius:14px;background:var(--soft);color:var(--muted);}
.week b{display:block;color:var(--ink);font-size:15px;}
.week span{font-size:12px;font-weight:700;}
@media (max-width:560px){
  .count b{font-size:56px;}
  .pair{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="wrap">
  <img class="hero" src="kyotsu-reading-hero.png" alt="共通テスト英語R 可視化リーディング。読む力と解く力を、見える化する。オンライン塾 THINKING">

  <nav class="map" aria-label="このページの中身">
    <a href="#time"><small>01</small><b>残り日数</b></a>
    <a href="#book"><small>02</small><b>補助教材</b></a>
  </nav>

  <section class="card" id="time" aria-labelledby="count-title">
    <p class="sec-no">01　残り日数</p>
    <h1 id="count-title">共通テストまで</h1>
    <p class="when">2027年1月16日（土）午前9時30分</p>
    <div class="count"><b id="days">—</b><span>日</span></div>
    <p class="subtime" id="subtime">残り時間を計算しています</p>
    <div class="hours">
      <p id="daily-label">1日の勉強時間を変える</p>
      <div class="stepper">
        <button class="step" type="button" id="minus" aria-label="30分減らす">−</button>
        <input id="daily" type="number" min="0.5" max="24" step="0.5" value="10" inputmode="decimal" aria-labelledby="daily-label">
        <button class="step" type="button" id="plus" aria-label="30分増やす">＋</button>
        <span class="unit">時間</span>
      </div>
      <p class="study" id="study-line">このペースだと、残り <b id="study-hours">—</b> 時間</p>
      <p class="hint">本番までの残り時間から計算しています。変えた数字はこの端末に残ります。</p>
    </div>
  </section>

  <section class="card" id="book">
    <p class="sec-no">02　補助教材</p>
    <div class="book">
      <img src="kyotsu-reading-book.png" alt="Z会 2027年用 共通テスト実戦模試 英語リーディングの表紙">
      <div>
        <h2>2027年用<br>共通テスト実戦模試<br>英語リーディング</h2>
        <p class="meta">Z会。オリジナル模試6回と、過去問3回が入っています。</p>
        <a class="btn video" href="https://link.amazon/B0ipL6B9K" target="_blank" rel="noopener noreferrer">
          <span class="t"><b>Amazonでこの本を見る</b><small>別のページで開きます</small></span>
          <span class="go" aria-hidden="true">→</span>
        </a>
      </div>
    </div>
  </section>

  <div id="questions"></div>
</div>

<script>
/* 解説動画・パワポ・解説ページは、用意できた問の URL を入れる。空なら「準備中」のまま。
   2026年本試験の問題PDFは lesson/pdf/2026-main-q1.pdf 〜 q8.pdf。 */
var QUESTIONS = [
  {
    n: 1,
    open: true,
    video: "https://utage-system.com/video/fbxA9oGymcbx",
    slides: "https://d27rnpuamwvieu.cloudfront.net/pdf/0GW3RemI8bJd1xUXxpkQpYgXX.pdf",
    practices: [
      {
        label: "2026年本試験",
        note: "ホブストンの校外学習",
        problem: "/lesson/pdf/2026-main-q1.pdf",
        explain: "/lesson/thinking_kyotsu_q1_r8_honshiken_hobston.html"
      },
      {
        label: "2025年本試験",
        note: "ダンス部の衣装",
        problem: "https://d27rnpuamwvieu.cloudfront.net/pdf/0gqauXdI6bh9Ktb7fyRfwLwXX.pdf",
        explain: "/lesson/thinking_kyotsu_q1_r7_honshiken_dance.html"
      },
      {
        label: "2025年追試験",
        note: "文房具店の広告",
        problem: "https://d27rnpuamwvieu.cloudfront.net/pdf/0bu0xeywnLvo8N3feC79jqQXX.pdf",
        explain: "/lesson/thinking_kyotsu_q1_r7_tsuishiken_stationery.html"
      }
    ]
  },
  {
    n: 2,
    open: true,
    video: "https://utage-system.com/video/LwKi3astAbqp",
    slides: "https://d27rnpuamwvieu.cloudfront.net/pdf/0ziGAATj53ua7tSXal98pBAXX.pdf",
    practices: [
      {
        label: "2026年本試験",
        note: "キャンパスの寮",
        problem: "/lesson/pdf/2026-main-q2.pdf",
        explain: "/lesson/thinking_kyotsu_q2_r8_honshiken_campus.html"
      },
      {
        label: "2025年本試験",
        note: "空飛ぶ車",
        problem: "https://d27rnpuamwvieu.cloudfront.net/pdf/0TrO39JPNbncQVykud5ahEQXX.pdf",
        explain: "/lesson/thinking_kyotsu_q2_r7_honshiken_flying.html"
      },
      {
        label: "2025年追試験",
        note: "家事は誰がする？",
        problem: "https://d27rnpuamwvieu.cloudfront.net/pdf/0GXZXOJDFw8uzmKYd5dW15AXX.pdf",
        explain: "/lesson/thinking_kyotsu_q2_r7_tsuishiken_housework.html"
      }
    ]
  },
  { n: 3, open: true, video: "", slides: "", practices: [
    { label: "2026年本試験", note: "", problem: "/lesson/pdf/2026-main-q3.pdf", explain: "" }
  ]},
  { n: 4, open: true, video: "", slides: "", practices: [
    { label: "2026年本試験", note: "", problem: "/lesson/pdf/2026-main-q4.pdf", explain: "" }
  ]},
  { n: 5, open: true, video: "", slides: "", practices: [
    { label: "2026年本試験", note: "", problem: "/lesson/pdf/2026-main-q5.pdf", explain: "" }
  ]},
  { n: 6, open: true, video: "", slides: "", practices: [
    { label: "2026年本試験", note: "", problem: "/lesson/pdf/2026-main-q6.pdf", explain: "" }
  ]},
  { n: 7, open: true, video: "", slides: "", practices: [
    { label: "2026年本試験", note: "", problem: "/lesson/pdf/2026-main-q7.pdf", explain: "" }
  ]},
  { n: 8, open: true, video: "", slides: "", practices: [
    { label: "2026年本試験", note: "", problem: "/lesson/pdf/2026-main-q8.pdf", explain: "" }
  ]}
];

var EXAM = new Date("2027-01-16T09:30:00+09:00");
var HOURS_KEY = "thinking-kyotsu-daily-hours";
var dailyInput = document.getElementById("daily");

function clampHours(n){
  if (!n || n < 0.5) return 0.5;
  if (n > 24) return 24;
  return Math.round(n * 2) / 2;
}
function savedHours(){
  var n = Number(localStorage.getItem(HOURS_KEY));
  return clampHours(n || 10);
}
function setHours(n){
  n = clampHours(n);
  dailyInput.value = String(n);
  localStorage.setItem(HOURS_KEY, String(n));
  renderCount();
}
dailyInput.value = String(savedHours());
dailyInput.addEventListener("change", function(){ setHours(Number(dailyInput.value)); });
document.getElementById("minus").addEventListener("click", function(){ setHours(Number(dailyInput.value) - 0.5); });
document.getElementById("plus").addEventListener("click", function(){ setHours(Number(dailyInput.value) + 0.5); });

function renderCount(){
  var ms = EXAM.getTime() - Date.now();
  var daysEl = document.getElementById("days");
  var subEl = document.getElementById("subtime");
  var studyEl = document.getElementById("study-hours");
  var daily = clampHours(Number(dailyInput.value) || 10);
  if (ms <= 0){
    daysEl.textContent = "0";
    subEl.textContent = "本番の時刻を過ぎています";
    studyEl.textContent = "0";
    return;
  }
  var day = 86400000;
  daysEl.textContent = String(Math.floor(ms / day));
  subEl.textContent = "あと " + Math.floor((ms % day) / 3600000) + "時間 " + Math.floor((ms % 3600000) / 60000) + "分";
  studyEl.textContent = Math.round((ms / day) * daily).toLocaleString("ja-JP");
}
renderCount();
setInterval(renderCount, 30000);

function action(href, title, detail, kind){
  if (!href) return "";
  return '<a class="btn ' + kind + '" href="' + href + '" target="_blank" rel="noopener noreferrer"><span class="t"><b>' + title + '</b><small>' + detail + '</small></span><span class="go" aria-hidden="true">→</span></a>';
}
function choice(href, label, kind){
  if (!href) return '<span class="wait">' + label.replace("を開く", "") + 'は準備中</span>';
  return '<a class="' + kind + '" href="' + href + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
}

function renderQuestions(){
  var byN = {};
  QUESTIONS.forEach(function(q){ byN[q.n] = q; });
  var html = "";
  for (var n = 1; n <= 8; n++){
    var q = byN[n];
    if (!q || !q.open) continue;
    var practices = (q.practices || []).map(function(item){
      return '<article class="paper"><header><span class="year">' + item.label + '</span>' + (item.note ? '<h3>' + item.note + '</h3>' : '') + '</header><div class="pair">' +
        choice(item.problem, "問題を開く", "problem") +
        choice(item.explain, "解説を開く", "explain") +
        "</div></article>";
    }).join("");
    var preview = action(q.video, "動画講義を見る", "目の動かし方を先に確認する", "video") +
      action(q.slides, "パワポを開く", "講義で使ったスライド", "slide");
    var previewBlock = preview ? '<div class="group"><h3>先に見る</h3><div class="stack">' + preview + '</div></div>' : "";
    var secNo = ("0" + (n + 2)).slice(-2);
    html += '<section class="card" id="q' + n + '"><p class="sec-no">' + secNo + '　第' + n + '問</p><h2>第' + n + '問対策</h2>' +
      previewBlock + '<div class="group"><h3>自分で解く</h3>' + practices + '</div></section>';
  }
  var weeks = "";
  var firstClosed = 0;
  var lastClosed = 0;
  for (var i = 1; i <= 8; i++){
    if (byN[i] && byN[i].open) continue;
    if (!firstClosed) firstClosed = i;
    lastClosed = i;
    weeks += '<div class="week" id="q' + i + '"><b>第' + i + '問</b><span>未公開</span></div>';
  }
  if (weeks){
    var laterTitle = firstClosed === lastClosed ? "第" + firstClosed + "問" : "第" + firstClosed + "問から第" + lastClosed + "問";
    html += '<section class="card later"><h2>' + laterTitle + '</h2><p class="lead">毎週1問ずつ追加します。いまはまだ開けません。</p><div class="weeks">' + weeks + '</div></section>';
  }
  document.getElementById("questions").innerHTML = html;
  var map = document.querySelector(".map");
  map.querySelectorAll("[data-qnav]").forEach(function(el){ el.remove(); });
  for (var m = 1; m <= 8; m++){
    if (!byN[m] || !byN[m].open) continue;
    var a = document.createElement("a");
    a.href = "#q" + m;
    a.setAttribute("data-qnav", "1");
    a.innerHTML = "<small>" + ("0" + (m + 2)).slice(-2) + "</small><b>第" + m + "問</b>";
    map.appendChild(a);
  }
}
renderQuestions();
</script>
</body>
</html>
