<style>

}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 64px}

/* ===== 共通パーツ ===== */
.card{
  background:var(--paper);
  border:1px solid rgba(0,0,0,.08);

  box-shadow:0 10px 30px rgba(0,0,0,.35);

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{

.lead{color:var(--ink-sub);font-size:.92rem}

.btn:active{transform:scale(.985)}
.btn-primary{

}
.btn-line{background:var(--line-green);color:#fff;box-shadow:0 6px 16px rgba(6,199,85,.3)}

.stack{display:grid;gap:12px;margin-top:20px}
.step-label{

}
.step-num{font-family:var(--font-num);font-size:.8rem;font-weight:600;color:var(--gold-deep);letter-spacing:.1em}

.grid-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid-btns .btn{padding:14px 6px;background:#fff;border:1.5px solid var(--paper-line);font-size:.98rem}

.grid-btns .btn:active,.opt:active{border-color:var(--gold-deep);background:var(--gold-soft)}

.quiz-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}

  font-family:var(--font-num);font-size:.8rem;font-weight:600;color:var(--gold-deep);

}
.opt.selected{border-color:var(--gold-deep);background:var(--gold-soft)}

.typedesc{font-size:.88rem;color:var(--ink);text-align:left;background:#fff;border:1px solid var(--paper-line);border-radius:8px;padding:14px}

.frow{display:grid;grid-template-columns:3.2em 1fr 3em;align-items:center;gap:10px;font-size:.82rem}
.frow .fname{font-weight:700}

.weak{margin-top:16px}

.rx li .n{
  flex:0 0 22px;height:22px;margin-top:2px;

  display:flex;align-items:center;justify-content:center;
}
.gap-line{
  margin-top:18px;text-align:center;font-family:var(--font-display);

.copied{

.copied.show{display:block;animation:rise .25s ease both}
.retry{text-align:center;margin-top:22px}
.retry a{color:rgba(250,247,239,.65);font-size:.8rem;text-decoration:underline;cursor:pointer}
.foot{
  text-align:center;margin-top:26px;color:rgba(250,247,239,.5);

.start-note{font-size:.75rem;color:var(--ink-sub);text-align:center;margin-top:12px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

  h1.title{font-size:1.6rem}

</style>

<script>

/* ============================================================

============================================================ */
const QUIZZES = {
/* ---------- 中1（be動詞・一般動詞・疑問文・否定文・can まで） ---------- */
j1:[
 {f:"vocab",u:"語彙：基本単語",q:"I get up at seven in the morning and eat（　）.",c:["breakfast","dinner","lunch","night"],a:0},
 {f:"vocab",u:"語彙：基本単語",q:"A: What（　）do you like?<br>B: I like blue.",c:["color","sport","food","animal"],a:0},
 {f:"vocab",u:"語彙：基本単語",q:"A: Are you a（　）?<br>B: Yes. I work at a hospital and help sick people.",c:["doctor","teacher","driver","farmer"],a:0},
 {f:"vocab",u:"語彙：基本単語",q:"I like music. I（　）the guitar every day.",c:["play","listen","eat","go"],a:0},
 {f:"grammar",u:"文法：be動詞",q:"I（　）a student at Minami Junior High School.",c:["am","is","are","do"],a:0},
 {f:"grammar",u:"文法：一般動詞の疑問文",q:"（　）you like English?",c:["Do","Are","Does","Is"],a:0},
 {f:"grammar",u:"文法：be動詞と主語",q:"Ken and I（　）in the tennis club.",c:["are","am","is","do"],a:0},
 {f:"grammar",u:"文法：代名詞",q:"This is Yuki.（　）is my sister.",c:["She","Her","Hers","He"],a:0},

 {f:"structure",u:"構造：否定文",q:"「私はサッカーファンではありません」<br>正しい英文は？",c:["I am not a soccer fan.","I don't a soccer fan.","I am a not soccer fan.","I not am a soccer fan."],a:0},
 {f:"reading",u:"読解：内容一致",p:"This is my friend Emma. She is from Australia. She can play the piano very well, but she can't play tennis.",q:"エマが「できること」は？",c:["ピアノを上手に弾くこと","テニスをすること","日本語を話すこと","歌を歌うこと"],a:0},

 {f:"reading",u:"読解：指示語（it）",p:"A: Do you like this song?<br>B: Yes! I listen to it every day.",q:"Bの言う「it」が指しているものは？",c:["この歌","Aさん","毎日","ラジオ"],a:0}

/* ---------- 中2（過去形・未来・不定詞・接続詞 まで／比較・受動態は出さない） ---------- */
j2:[
 {f:"vocab",u:"語彙：基本動詞",q:"The train（　）at Tokyo Station at ten in the morning.",c:["arrives","practices","invites","borrows"],a:0},

 {f:"structure",u:"構造：if節の時制",q:"「もし明日晴れたら、私は釣りに行きます」<br>正しい英文は？",c:["If it is sunny tomorrow, I will go fishing.","If it will be sunny tomorrow, I will go fishing.","If it is sunny tomorrow, I went fishing.","If it sunny tomorrow, I will go fishing."],a:0},

 {f:"reading",u:"読解：指示語（it）",p:"Our school has a music festival in November. Many students practice hard for it after school.",q:"「it」が指しているものは？",c:["音楽祭","学校","11月","放課後"],a:0}
],

const app = document.getElementById("app");
let S = {};

function resetState(){
  S = {gradeId:null, gradeLabel:"", quizKey:"", school:"", dev:"", qIndex:0, items:[], answers:[], code:""};
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function makeCode(){
  const d = new Date();
  const mmdd = String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let r = "";
  for(let i=0;i<4;i++) r += chars[Math.floor(Math.random()*chars.length)];
  return "TH-" + mmdd + "-" + r;
}

/* ---------- 画面：学年 ---------- */
function renderGrade(){
  const groups = ["中学生","高校生","既卒"];
  let html = `<div class="card">
    <div class="step-label"><span class="step-num">STEP 1 / 3</span><span class="step-q">学年を選んでください</span></div>
    <p class="qnote">学年に合わせて、出題される問題が変わります。</p>`;
  groups.forEach(g=>{
    const items = GRADES.filter(x=>x.group===g);
    if(g!=="既卒") html += `<div class="group-label">${g}</div>`;
    else html += `<div class="group-label">高校卒業後</div>`;
    html += `<div class="grid-btns" style="margin-bottom:4px">`;
    items.forEach(x=>{
      html += `<button class="btn ${x.wide?"wide":""}" data-g="${x.id}">${x.label}</button>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
  app.querySelectorAll("[data-g]").forEach(b=>{
    b.onclick = ()=>{
      const g = GRADES.find(x=>x.id===b.dataset.g);
      S.gradeId = g.id; S.gradeLabel = g.label; S.quizKey = g.quiz;
      renderSchool();
    };
  });
}

/* ---------- 画面：志望校 ---------- */
function renderSchool(){
  const isJr = S.quizKey.startsWith("j");
  const ph = isJr ? "例：〇〇高校" : "例：早稲田大学 商学部";
  app.innerHTML = `
  <div class="card">
    <div class="step-label"><span class="step-num">STEP 2 / 3</span><span class="step-q">志望校を教えてください</span></div>
    <input class="text" id="school" type="text" placeholder="${ph}" autocomplete="off">
    <div class="stack">
      <button class="btn btn-primary" id="next">次へ</button>
      <button class="btn btn-ghost" id="undecided">まだ決めていない</button>
    </div>
  </div>`;
  const input = document.getElementById("school");
  document.getElementById("next").onclick = ()=>{
    S.school = input.value.trim() || "未定";
    renderDev();
  };
  document.getElementById("undecided").onclick = ()=>{ S.school = "未定"; renderDev(); };
}

function renderDev(){
  let html = `<div class="card">
    <div class="step-label"><span class="step-num">STEP 3 / 3</span><span class="step-q">英語の偏差値は？（直近の模試）</span></div>
    <div class="grid-btns" style="grid-template-columns:1fr 1fr">`;
  DEV_BANDS.forEach((d,i)=>{
    const wide = (i===DEV_BANDS.length-1) ? "wide" : "";
    html += `<button class="btn ${wide}" data-d="${d}">${d}</button>`;
  });
  html += `</div></div>`;
  app.innerHTML = html;
  app.querySelectorAll("[data-d]").forEach(b=>{
    b.onclick = ()=>{ S.dev = b.dataset.d; startQuiz(); };
  });
}

/* ---------- クイズ ---------- */
function startQuiz(){
  const src = QUIZZES[S.quizKey];
  S.items = src.map(q=>{
    const order = shuffle(q.c.map((_,i)=>i));
    return {f:q.f, u:q.u, q:q.q, p:q.p||null, choices:order.map(i=>q.c[i]), correct:order.indexOf(q.a)};
  });
  S.qIndex = 0; S.answers = [];
  renderQuiz();
}

function renderQuiz(){
  const item = S.items[S.qIndex];
  const total = S.items.length;
  const keys = ["A","B","C","D"];
  let html = `<div class="card">
    <div class="quiz-head">
      <span class="qcount">Q ${S.qIndex+1}<small> / ${total}</small></span>
      <span class="qtotal">英語設計診断</span>
    </div>
    <div class="progress"><i style="width:${(S.qIndex/total)*100}%"></i></div>
    <span class="section-tag">${SECTION_TAG[item.f]}</span>
    ${item.p ? `<div class="qnote">次の英文を読んで答えてください。</div><div class="passage">${item.p}</div>` : ``}
    <div class="qtext">${item.q}</div>
    <div class="opts">`;
  item.choices.forEach((c,i)=>{
    html += `<button class="opt" data-i="${i}"><span class="key">${keys[i]}</span><span>${c}</span></button>`;
  });
  html += `</div></div>`;
  app.innerHTML = html;

  let locked = false;
  app.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>{
      if(locked) return;
      locked = true;
      b.classList.add("selected");
      app.querySelectorAll(".opt").forEach(x=>x.disabled = true);
      const i = Number(b.dataset.i);
      S.answers.push({f:item.f, u:item.u, ok: i===item.correct});
      setTimeout(()=>{
        S.qIndex++;
        if(S.qIndex < S.items.length) renderQuiz();
        else renderAnalyzing();
      }, 350);
    };
  });
}

/* ---------- 分析中 ---------- */
function renderAnalyzing(){
  app.innerHTML = `
  <div class="card analyzing">
    <div class="spinner"></div>
    <div class="ana-line" id="ana"></div>
  </div>`;
  const lines = ["回答を集計しています…","語彙・文法・構造・読解の正答率を計算しています…","弱点単元を特定しています…","診断タイプを判定しています…"];
  const el = document.getElementById("ana");
  let i = 0;
  el.textContent = lines[0];
  const t = setInterval(()=>{
    i++;
    if(i < lines.length){ el.textContent = lines[i]; }
    else { clearInterval(t); renderResult(); }
  }, 600);
}

/* ---------- 判定ロジック ---------- */
function calcResult(){
  const total = S.answers.length;
  const correct = S.answers.filter(a=>a.ok).length;
  const score = Math.round(correct/total*100);
  let level;
  if(score>=90) level=5; else if(score>=75) level=4; else if(score>=58) level=3; else if(score>=40) level=2; else level=1;

  const fields = ["vocab","grammar","structure","reading"];
  const rate = {};
  fields.forEach(f=>{
    const fs = S.answers.filter(a=>a.f===f);
    rate[f] = fs.length ? fs.filter(a=>a.ok).length/fs.length : 0;
  });

  let typeKey;
  const lowCount = fields.filter(f=>rate[f]<0.5).length;
  if(fields.every(f=>rate[f]>=0.75)) typeKey = "jissen";
  else if(lowCount>=2) typeKey = "kiso";
  else {
    typeKey = fields.reduce((min,f)=> rate[f] < rate[min] ? f : min, fields[0]);
  }

  const weakUnits = [...new Set(S.answers.filter(a=>!a.ok).map(a=>a.u))].slice(0,4);
  const marks = S.answers.map(a=>a.ok?"○":"×").join("");
  return {score, level, rate, typeKey, weakUnits, marks};
}

/* ---------- コピー用テキスト ---------- */
function buildCopyText(r){
  const pct = f => Math.round(r.rate[f]*100) + "％";
  const weak = r.weakUnits.length ? r.weakUnits.join("／") : "なし（全問正解）";
  return [
    "━━━━━━━━━━━━",
    "【英語設計診断 結果】",
    "学年：" + S.gradeLabel,
    "志望校：" + S.school,
    "英語偏差値：" + S.dev,
    "────────────",
    "スコア：" + r.score + "／100（Lv." + r.level + "）",
    "タイプ：" + TYPES[r.typeKey].name,
    "語彙 " + pct("vocab") + "｜文法 " + pct("grammar"),
    "構造 " + pct("structure") + "｜読解 " + pct("reading"),
    "弱点単元：" + weak,
    "正誤：" + r.marks,
    "診断コード：" + S.code,
    "━━━━━━━━━━━━",
    "↑このまま送信してください！"
  ].join("\n");
}

/* ---------- 画面：結果 ---------- */
function renderResult(){
  const r = calcResult();
  S.code = makeCode();
  const type = TYPES[r.typeKey];
  const today = new Date();
  const dateStr = today.getFullYear() + "." + String(today.getMonth()+1).padStart(2,"0") + "." + String(today.getDate()).padStart(2,"0");
  const pct = f => Math.round(r.rate[f]*100);
  const weakHtml = r.weakUnits.length
    ? r.weakUnits.map(u=>`<span class="wchip">${u}</span>`).join("")
    : `<span class="wchip">なし（全問正解！）</span>`;
  const gapSchool = S.school==="未定" ? "あなたの志望校" : "『"+escapeHtml(S.school)+"』";

  app.innerHTML = `
  <div class="sheet"><div class="sheet-inner">
    <div class="titleblock">
      <div class="tb-left">
        <div class="eyebrow">DIAGNOSIS SHEET</div>
        <h2>英語設計診断 結果</h2>
      </div>
      <div class="tb-right">DATE ${dateStr}<b>${S.code}</b></div>
    </div>

    <div class="profile-row">
      <span>学年：<b>${S.gradeLabel}</b></span>
      <span>志望校：<b>${escapeHtml(S.school)}</b></span>
      <span>英語偏差値：<b>${S.dev}</b></span>
    </div>

    <div class="scorebox">
      <div class="score">${r.score}<small>/100</small></div>
      <div class="lvl">Lv.${r.level}</div>
    </div>

    <div class="typebox">
      <div class="cap">あなたの診断タイプ</div>
      <div class="typename">${type.name}</div>
      <div class="typedesc">${type.desc}</div>
    </div>

    <div class="fields">
      ${["vocab","grammar","structure","reading"].map(f=>`
      <div class="frow">
        <span class="fname">${FIELD_LABEL[f]}</span>
        <span class="fbar"><i style="width:${pct(f)}%"></i></span>
        <span class="fpct">${pct(f)}%</span>
      </div>`).join("")}
    </div>

    <div class="weak">
      <div class="cap">弱点単元</div>
      <div class="weak-chips">${weakHtml}</div>
    </div>

    <div class="comment">${GRADE_COMMENT[S.quizKey]}<br>${LEVEL_COMMENT[r.level]}</div>

    <div class="rx">
      <div class="cap">この夏の処方箋（${type.name}）</div>
      <ol>
        ${type.rx.map((t,i)=>`<li><span class="n">${i+1}</span><span>${t}</span></li>`).join("")}
      </ol>
    </div>

    <div class="gap-line">${gapSchool}までの「具体的な設計」は、<br>ここから先の面談でつくります。</div>

    <div class="gift">
      <div class="cap">送信特典</div>
      ${GIFT_TEXT}
    </div>

    <div class="cta">
      <button class="btn btn-primary" id="copy">結果をコピーする</button>
      <div class="copied" id="copied">コピーしました！LINEを開いて、そのまま貼り付けて送信してください。</div>
      <a class="btn btn-line" href="${LINE_URL}" target="_blank" rel="noopener">LINEを開いて送る</a>
      <p class="cta-note">①「結果をコピーする」→ ②「LINEを開いて送る」→ ③トークに貼り付けて送信</p>
    </div>
  </div></div>
  <div class="retry"><a id="retry">もう一度診断する</a></div>`;

  const copyText = buildCopyText(r);
  document.getElementById("copy").onclick = ()=> doCopy(copyText);
  document.getElementById("retry").onclick = renderStart;
}

function doCopy(text){
  const done = ()=>{
    const el = document.getElementById("copied");
    el.classList.add("show");
    const btn = document.getElementById("copy");
    btn.textContent = "コピーしました ✓";
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand("copy"); done(); }
  catch(e){ alert("コピーできませんでした。結果画面をスクショして送ってください。"); }
  document.body.removeChild(ta);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}

renderStart();
</script>
</body>
</html>
