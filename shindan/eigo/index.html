<style>

<script>
/* ============================================================
   ★ 差し替えポイント（運用前に必ず確認）
   ① LINE_URL   … 公式LINEのURL
   ② GIFT_TEXT  … 送信特典の文言
   ③ QUIZZES    … 問題データ（設計ポリシーは同フォルダの README.md 参照）
   ④ TYPES      … タイプ名・説明文・夏の処方箋
============================================================ */
const LINE_URL  = "https://liff.line.me/1656043253-rkMxPZMQ/landing?follow=%40499yrupi&lp=JDVkS9&liff_id=1656043253-rkMxPZMQ"; // ★①
const GIFT_TEXT = "この結果をLINEに送ってくれた人限定で、学年別「夏の英語設計シート」をプレゼント。さらに希望者は、無料の英語設計面談へご案内します。"; // ★②

/* ---------- 学年（アンケートは7分岐 / テストは6セット） ---------- */
const GRADES = [
  {id:"j1", label:"中1", quiz:"j1", group:"中学生"},
  {id:"j2", label:"中2", quiz:"j2", group:"中学生"},
  {id:"j3", label:"中3", quiz:"j3", group:"中学生"},
  {id:"h1", label:"高1", quiz:"h1", group:"高校生"},
  {id:"h2", label:"高2", quiz:"h2", group:"高校生"},
  {id:"h3", label:"高3", quiz:"h3", group:"高校生"},
  {id:"rn", label:"既卒・浪人", quiz:"h3", group:"既卒", wide:true}
];

const DEV_BANDS = ["〜45","45〜52","52〜58","58〜65","65〜","模試未受験・わからない"];

/* ============================================================
   問題データ ★③ — 「英語の読み方」診断
   全問が共通の問い：「この英文を、正しく読めたか？」
   ・f: str（構造把握＝誰が何をしたか・主節はどれか・修飾はどこに掛かるか）
        para（言い換え＝内容を正しく言い換えた選択肢を選べるか。
              誤答は主客反転・肯否反転・因果反転・時系列ずらしで作る）
        logic（論理・文脈＝接続詞・指示語・譲歩・具体例の役割）
   ・s: 対象の英文（すべての問題に英文がつく）
   ・q: 設問（日本語）
   ・c: 選択肢4つ（c[0]が正解。表示時シャッフル。
        これに加えて「わからない」が全問に自動でつく）
   ・d: 難度 1/2/3（配点 8/10/12。各学年 d1×3+d2×4+d3×3＝100点満点。
        満点は最難問3問を含む全問正解でのみ出る）
   ・t: 制限時間（秒）。切れたら未回答として自動で次へ
   ・u: 弱点単元名（結果とLINE送信テキストに表示）
   ・出題範囲は「その学年の8月時点で既習」の文法に限定。
     学年が上がるほど、文が長く・節が深く・言い換えが精密になる。
============================================================ */
const QUIZZES = {
/* ---------- 中1（be動詞・一般動詞・can・疑問詞の範囲） ---------- */
j1:[
 {f:"str",d:1,t:45,u:"構造：修飾語と主語",s:"The boy by the window is my brother Ken.",q:"「私の兄」なのは誰？",c:["窓のそばにいる男の子","ケンの友達","窓のそばにいる女の子","この文を書いた人の父"],a:0},
 {f:"logic",d:1,t:45,u:"論理：butのつながり",s:"Tom's dog is very big, but my dog is small.",q:"小さいのは、どちらの犬？",c:["「私」の犬","トムの犬","両方の犬","どちらの犬でもない"],a:0},
 {f:"para",d:1,t:50,u:"言い換え：できる／できない",s:"Ken can't swim fast, but he can swim very far.",q:"この文の内容に最も近いものは？",c:["ケンは速くは泳げないが、とても遠くまで泳げる","ケンは速く泳げるが、遠くへは泳げない","ケンはまったく泳げない","ケンは速くも遠くも泳げる"],a:0},
 {f:"str",d:2,t:50,u:"構造：withがつなぐ相手",s:"My sister and I play tennis with our father every Sunday.",q:"毎週日曜日にテニスをしているのは、全部で誰？",c:["姉と私と父","姉と私だけ","私と父だけ","父だけ"],a:0},
 {f:"para",d:2,t:55,u:"言い換え：onlyの範囲",s:"I don't play video games on school days. I play them only on weekends.",q:"この文の内容に最も近いものは？",c:["学校がある日はゲームをせず、週末だけゲームをする","週末はゲームをしない","毎日ゲームをしている","学校の中でだけゲームをする"],a:0},
 {f:"logic",d:2,t:55,u:"論理：文と文の関係（理由）",s:"I like dogs very much, but I can't have one at home. My house is very small.",q:"「私」が家で犬を飼えない理由として、この文章から読み取れるものは？",c:["家がとても小さいから","犬が好きではないから","家族が反対しているから","犬の世話が大変だから"],a:0},
 {f:"str",d:2,t:55,u:"構造：否定と代名詞",s:"That tall girl with long hair is not Yuki. She is Emi, Yuki's sister.",q:"背が高くて髪の長い女の子は、誰？",c:["エミ","ユキ","ユキの友達","エミの母"],a:0},
 {f:"para",d:3,t:60,u:"言い換え：対比の整理",s:"Mika is not a good singer, but she is a very good dancer. Her brother is a good singer, but he can't dance.",q:"この文章の内容に合うものは？",c:["ミカは歌が苦手でダンスが得意、兄は歌が得意でダンスができない","ミカも兄も歌が得意だ","ミカは歌もダンスも得意だ","兄はダンスがとても得意だ"],a:0},
 {f:"logic",d:3,t:60,u:"論理：会話の意図",s:"A: Do you want this red pen?<br>B: No, thank you. I have three red pens in my bag.",q:"Bがペンを断った理由として最も自然なものは？",c:["赤ペンはもう十分に持っているから","赤い色が好きではないから","かばんが小さくて入らないから","Aのペンは書きにくいから"],a:0},
 {f:"para",d:3,t:70,u:"言い換え：複数文の整理",s:"We all like Mr. Sato very much, but he is not our English teacher. Our English teacher is Ms. Brown. She is from Canada, and her Japanese is very good.",q:"この文章の内容に合うものは？",c:["英語の先生はカナダ出身のブラウン先生で、日本語がとても上手だ","サトウ先生はこのクラスの英語の先生だ","ブラウン先生は日本語がうまく話せない","クラスのみんなはサトウ先生が好きではない"],a:0}
],

j2:[
 {f:"str",d:1,t:50,u:"構造：前置詞句の整理",s:"The bag under the desk is not mine. Mine is on the chair by the door.",q:"「私」のかばんは、どこにある？",c:["ドアのそばの椅子の上","机の下","ドアの上","机の上"],a:0},
 {f:"para",d:1,t:50,u:"言い換え：因果の把握",s:"Tom studied Japanese hard last year, so now he can read easy Japanese books.",q:"この文の内容に最も近いものは？",c:["トムは去年一生懸命勉強したので、今は簡単な日本語の本を読める","トムはこれから日本語を勉強するつもりだ","トムは難しい日本語の本も読める","トムは日本語の勉強をあきらめた"],a:0},
 {f:"logic",d:1,t:50,u:"論理：so（だから）の関係",s:"It was raining hard yesterday morning, so our soccer game started in the afternoon.",q:"試合が午後に始まった理由は？",c:["午前中は激しい雨だったから","午後の方が観客が多いから","選手たちが遅れて来たから","朝は気温が低すぎたから"],a:0},
 {f:"str",d:2,t:55,u:"構造：従属節と主節の主語",s:"When my mother came home, I was cooking dinner for my sister.",q:"夕食を作っていたのは誰？",c:["私","母","妹","母と私"],a:0},
 {f:"para",d:2,t:60,u:"言い換え：時と回数の整理",s:"I'm going to visit Okinawa next month. I went there five years ago, so this will be my second time.",q:"この文章の内容に最も近いものは？",c:["私が沖縄に行くのは、来月で2回目になる","私は来月、初めて沖縄に行く","私は5年前から沖縄に住んでいる","私はもう沖縄に2回行ったことがある"],a:0},
 {f:"logic",d:2,t:55,u:"論理：指示語（it）",s:"Last week, our class talked about a plan to clean the park near the station. Many students liked it very much.",q:"「it」が指しているものは？",c:["駅の近くの公園を掃除する計画","駅","先週の授業","公園の近くの店"],a:0},
 {f:"para",d:2,t:60,u:"言い換え：譲歩の整理",s:"My brother doesn't like soccer, but he watches soccer games on TV when our father watches them.",q:"この文の内容に合うものは？",c:["兄はサッカーが好きではないが、父が見ているときはテレビで試合を見る","兄はサッカーが大好きで、毎日試合を見る","兄はサッカーの試合を決して見ない","父はサッカーの試合を見ない"],a:0},
 {f:"str",d:3,t:70,u:"構造：だれが何をしたか",s:"Ken didn't go to school yesterday because he was sick, so Mika visited him after school to give the homework to him.",q:"昨日の放課後に起きたこととして正しいものは？",c:["ミカが、宿題を渡すためにケンのところを訪ねた","ケンが、宿題を渡すためにミカのところを訪ねた","ミカが病気で学校を休んだ","ケンが放課後にみんなの宿題を集めた"],a:0},
 {f:"para",d:3,t:70,u:"言い換え：時間の変化の整理",s:"When I was a child, I wanted to be a pilot. But now I want to be a doctor because I want to help sick children in poor countries.",q:"この文章の内容に最も近いものは？",c:["昔の夢はパイロットだったが、今は貧しい国の病気の子どもを助けるために医者になりたい","今もパイロットになりたいと思っている","子どもの頃から医者になることが夢だった","貧しい国でパイロットとして働きたい"],a:0},
 {f:"logic",d:3,t:70,u:"論理：予想と結果",s:"Everyone said, \"Aki will win the speech contest.\" But the winner was Rio, a quiet girl. Aki said to her, \"Your speech was wonderful. I need to practice more.\"",q:"この文章の内容に合うものは？",c:["みんなの予想に反してリオが優勝し、アキはリオのスピーチをたたえた","予想どおりアキが優勝した","リオはアキに「もっと練習が必要だ」と言った","アキは結果に不満を持っている"],a:0}
],
/* ---------- 中3（現在完了・受動態・不定詞応用の範囲） ---------- */
j3:[
 {f:"str",d:1,t:55,u:"構造：受動態と主語",s:"This temple was built about four hundred years ago and is visited by many people every year.",q:"この文の内容に合うものは？",c:["この寺は約400年前に建てられ、今も毎年多くの人が訪れる","この寺は建てるのに400年かかった","人々は今、この寺を建てているところだ","この寺を訪れる人は年々減っている"],a:0},
 {f:"para",d:1,t:55,u:"言い換え：butの範囲",s:"Sushi is loved by people all over the world, but some popular sushi in other countries is different from sushi in Japan.",q:"この文の内容に最も近いものは？",c:["寿司は世界中で愛されているが、海外で人気の寿司には日本の寿司と違うものもある","海外の寿司は日本の寿司と全く同じだ","寿司は日本以外では人気がない","日本の寿司は海外の寿司より人気がない"],a:0},
 {f:"logic",d:1,t:55,u:"論理：指示語（This）",s:"Many people use plastic bags only once and throw them away. This is a big problem for the sea and its animals.",q:"「This」が指している内容は？",c:["ビニール袋を一度だけ使って捨てること","海の動物が増えていること","ビニール袋を作ること","人々が海へ行くこと"],a:0},
 {f:"str",d:2,t:60,u:"構造：形式主語とfor＋人",s:"It is difficult for my little brother to read this book, but it is easy for me.",q:"この本を読むのが難しいのは誰？",c:["弟","私","私と弟の両方","この家族の全員"],a:0},
 {f:"logic",d:2,t:60,u:"論理：具体例の役割",s:"Learning a language takes a long time. For example, my uncle has studied Chinese for ten years, but he still finds it difficult.",q:"おじの例は、何を示すために挙げられている？",c:["言語を学ぶには長い時間がかかるということ","中国語は世界で一番難しいということ","おじの勉強のやり方が悪いということ","10年学べば言語は完成するということ"],a:0},
 {f:"para",d:2,t:65,u:"言い換え：経験と理由",s:"I have never seen snow because I have lived in Okinawa since I was born. So I want to visit Hokkaido in winter someday.",q:"この文章の内容に最も近いものは？",c:["生まれてからずっと沖縄に住んでいて雪を見たことがないので、いつか冬の北海道に行ってみたい","私は北海道で初めて雪を見た","私は雪を何度も見たことがある","私は冬の沖縄で雪を見たい"],a:0},
 {f:"logic",d:2,t:65,u:"論理：理由の特定",s:"Robots are often used in factories in Japan. However, using robots in homes is not easy because homes are all different and full of many things.",q:"家庭でロボットを使うのが簡単ではない理由は？",c:["家はそれぞれ違っていて、物も多いから","家は工場より広いから","ロボットの値段が高すぎるから","日本には工場が多すぎるから"],a:0},
 {f:"str",d:3,t:70,u:"構造：節をまたぐ主語と目的語",s:"Mr. Tanaka has taught English at our school since my mother was a student here, so everyone in this town knows him.",q:"この文の内容に合うものは？",c:["田中先生は母が生徒だった頃からこの学校で教えていて、町のみんなが先生を知っている","田中先生は町のみんなのことをよく知っている","母は田中先生のことを知らない","田中先生は最近この学校に来たばかりだ"],a:0},
 {f:"para",d:3,t:80,u:"言い換え：英語での言い換え",s:"Kota practiced the guitar every day, but he was not able to play well in front of people because he was too nervous.",q:"上の英文に最も近い意味の英文は？",c:["Kota practiced the guitar every day, but he could not play well in front of people because he was very nervous.","Kota could play very well in front of people because he practiced every day.","Kota did not practice every day, so he could not play the guitar well.","Kota stopped practicing the guitar because he was very nervous."],a:0},
 {f:"para",d:3,t:80,u:"言い換え：誰がどう思っているか",s:"Emi has wanted to study art in France since she saw a famous painting in Tokyo, but her parents want her to study science in Japan.",q:"この文の内容に合うものは？",c:["エミは東京で名画を見て以来フランスで美術を学びたいと思っているが、両親は日本で理科系の勉強をしてほしいと思っている","エミの両親は、エミの留学に賛成している","エミはフランスで有名な絵を見た","エミは理科を学ぶために日本に残ると決めた"],a:0}
],
/* ---------- 高1（5文型・時制・助動詞・受動態の範囲） ---------- */
h1:[
 {f:"str",d:1,t:55,u:"構造：不定詞の修飾とSVOC",s:"My plan to study abroad next year made my parents worried.",q:"心配しているのは誰？",c:["両親","私","来年の担任の先生","留学先の家族"],a:0},
 {f:"para",d:1,t:65,u:"言い換え：対比",s:"Kenji looks quiet at school, but at home he talks a lot with his family.",q:"上の英文に最も近い意味の英文は？",c:["Kenji seems quiet at school and talkative at home.","Kenji talks a lot both at school and at home.","Kenji is quiet at home because he talks a lot at school.","Kenji's family thinks he is too quiet at home."],a:0},
 {f:"logic",d:1,t:60,u:"論理：As a result（因果）",s:"More and more people are shopping online. As a result, many small shops in my town have closed.",q:"この2文の関係として正しいものは？",c:["ネットで買い物をする人が増えたことが、町の小さな店が閉店した原因になっている","小さな店が閉店したので、ネットで買う人が増えた","2つの文は関係のない事実を並べている","町の店はネット販売を始めた"],a:0},
 {f:"str",d:2,t:65,u:"構造：主語になる不定詞とit",s:"To get up early every day is not easy, but it has changed my mornings completely.",q:"「it」が指しているものは？",c:["毎日早起きをすること","朝の時間","私の生活すべて","早起きが簡単だということ"],a:0},
 {f:"para",d:2,t:75,u:"言い換え：否定の理由",s:"Mari didn't tell her best friend about her problem because she didn't want to make her worried.",q:"上の英文に最も近い意味の英文は？",c:["Mari kept her problem secret because she didn't want her best friend to worry.","Mari told her best friend everything about her problem.","Mari's best friend refused to listen to her problem.","Mari was worried because her best friend had a problem."],a:0},
 {f:"para",d:2,t:80,u:"言い換え：予定の変更",s:"The school festival was going to be held outside, but the plan was changed at the last minute because of the rain, and it was held in the gym instead.",q:"上の英文に最も近い意味の英文は？",c:["The festival took place in the gym because the rain changed the original plan to hold it outside.","The festival was held outside in the rain.","The festival was canceled because of the rain.","The gym was closed, so the festival was held outside."],a:0},
 {f:"logic",d:2,t:70,u:"論理：However（逆接の範囲）",s:"Eating vegetables is important for our health. However, just eating a lot of them is not enough — we also need enough sleep and exercise.",q:"Howeverの後で筆者が言いたいことは？",c:["野菜は大切だが、それだけでは健康には不十分だ","野菜は健康に良くない","野菜をたくさん食べれば健康になれる","睡眠より野菜の方が大切だ"],a:0},
 {f:"str",d:3,t:75,u:"構造：挿入とSVの把握",s:"The best way to learn a new word, my teacher always says, is to use it in your own sentence.",q:"この文の中心となる主語（S）と動詞（V）は？",c:["S：The best way to learn a new word ／ V：is","S：my teacher ／ V：says","S：a new word ／ V：is","S：my teacher ／ V：is"],a:0},
 {f:"para",d:3,t:85,u:"言い換え：譲歩と行動",s:"Although he was told by his doctor to rest for a week, Sam went back to work after three days because his team needed him.",q:"上の英文に最も近い意味の英文は？",c:["Sam's doctor told him to rest for a week, but he returned to work earlier than that because his team needed him.","Sam rested for a full week, just as his doctor said.","Sam's team told him to rest for a week at home.","Sam went back to work because his doctor said it was OK."],a:0},
 {f:"logic",d:3,t:75,u:"論理：譲歩（Of course... But）",s:"Of course, making mistakes in English class is embarrassing. But every mistake shows you one thing to practice next. In this way, mistakes help you improve.",q:"筆者の主張に最も近いものは？",c:["ミスは次に練習すべきことを教えてくれるので、上達の役に立つ","ミスは恥ずかしいので、できるだけ避けるべきだ","ミスをしない人だけが英語がうまくなる","英語の授業ではミスをしてはいけない"],a:0}
],
/* ---------- 高2（関係詞・比較・準動詞・仮定法過去の範囲） ---------- */
h2:[
 {f:"str",d:1,t:65,u:"構造：関係詞のネストとSV",s:"The scientist who discovered the medicine that saved thousands of children received an international prize.",q:"賞を受け取ったのは？",c:["その薬を発見した科学者","数千人の子どもたち","子どもたちを救った薬","国際的な団体"],a:0},
 {f:"para",d:1,t:70,u:"言い換え：few（否定）",s:"Few people knew the singer's real name before the TV show, but now almost everyone in this country knows it.",q:"上の英文に最も近い意味の英文は？",c:["Before the TV show, almost no one knew the singer's real name, but now nearly everyone in this country does.","Many people knew the singer's real name before the TV show.","Even now, only a few people know the singer's real name.","The singer has never told anyone his real name."],a:0},
 {f:"logic",d:1,t:65,u:"論理：Therefore（因果）",s:"Reading novels lets you experience many different lives. Therefore, people who read a lot often understand other people's feelings well.",q:"Thereforeが結んでいる関係として正しいものは？",c:["小説で多様な人生を体験できることが、読書家が他人の気持ちをよく理解できる理由になっている","他人の気持ちがわかる人ほど、小説を読むようになるという順序で述べている","2つの文は無関係な事実を並べている","小説より実体験の方が大切だと述べている"],a:0},
 {f:"str",d:2,t:75,u:"構造：接触節と前置詞句の連鎖",s:"The restaurant my uncle opened last year in a small town near the sea is now famous for its fish dishes.",q:"「今では魚料理で有名」なのは？",c:["おじが海の近くの小さな町に開いたレストラン","おじ本人","海の近くの小さな町","おじに料理を教えた人"],a:0},
 {f:"para",d:2,t:80,u:"言い換え：仮定法の含意",s:"If I had enough money, I would buy the house whose windows face the sea.",q:"上の英文に最も近い意味の英文は？",c:["I can't buy the house whose windows face the sea because I don't have enough money.","I have enough money, so I will buy the house by the sea.","I bought the house whose windows face the sea.","The house I bought doesn't have windows facing the sea."],a:0},
 {f:"para",d:2,t:85,u:"言い換え：否定比較とso...that",s:"The movie was not as boring as I expected; in fact, it was so moving that I went to see it again the next day.",q:"上の英文に最も近い意味の英文は？",c:["I expected the movie to be boring, but it actually moved me so much that I watched it again.","The movie was just as boring as I expected.","I expected a moving movie, but it turned out to be boring.","I saw the movie again because I missed the first half."],a:0},
 {f:"logic",d:2,t:75,u:"論理：In other words（言い換え）",s:"Sleep is the time when the brain organizes the day's information. In other words, if you cut down on sleep to study more, you may actually remember less.",q:"In other words以下が述べていることは？",c:["睡眠を削って勉強量を増やすと、かえって覚えられなくなる可能性がある","勉強すればするほど記憶は定着する","睡眠中は脳が完全に休んでいる","勉強の後は運動をするべきだ"],a:0},
 {f:"str",d:3,t:85,u:"構造：節の切れ目と因果",s:"The letter she was waiting for arrived on the very morning she left for London, so no one was at home to receive it.",q:"この文の内容に合うものは？",c:["待っていた手紙は、彼女がロンドンへ出発したまさにその朝に届いたため、受け取る人が家にいなかった","彼女は手紙を受け取ってからロンドンへ出発した","手紙はロンドンから届いた","彼女は手紙を待って、ずっと家にいた"],a:0},
 {f:"para",d:3,t:95,u:"言い換え：反対要素の見抜き",s:"The plan to build a large factory near the lake met strong opposition from the people of the town, who feared that the water they drank every day would no longer be safe.",q:"上の英文に最も近い意味の英文は？",c:["The townspeople strongly opposed the factory plan because they were afraid their drinking water would become unsafe.","The townspeople welcomed the factory because it would make their water cleaner.","The factory was built quickly because nobody opposed the plan.","The people feared the lake would dry up, so they supported the factory plan."],a:0},
 {f:"logic",d:3,t:85,u:"論理：譲歩からの主張",s:"It is true that memorizing model answers can raise your test scores quickly. However, students who rely only on memorization often fail when questions are asked in unfamiliar ways, because they have never learned to think from the basics.",q:"筆者の主張に最も近いものは？",c:["暗記だけに頼ると、見慣れない問われ方をされたときに対応できないことが多い","模範解答の暗記は、点数を上げる最良の方法だ","見慣れない問題は入試には出ない","基礎から考える生徒は点数が伸びにくい"],a:0}
],
/* ---------- 高3・既卒（全範囲） ---------- */
h3:[
 {f:"str",d:1,t:70,u:"構造：倒置（Not until）",s:"Not until the results were announced did the players realize how close the game had been.",q:"この文の内容に合うものは？",c:["結果が発表されて初めて、選手たちは試合がどれほど接戦だったかを知った","選手たちは試合中から接戦だと感じていた","結果はまだ発表されていない","選手たちが結果を発表した"],a:0},
 {f:"para",d:1,t:70,u:"言い換え：Despite（譲歩）",s:"Despite months of careful preparation, the school trip was canceled just two days before departure.",q:"この文の内容に最も近いものは？",c:["何か月も入念に準備されたにもかかわらず、修学旅行は出発のわずか2日前に中止された","修学旅行は2日間だけ行われた","準備不足のため、修学旅行は延期された","修学旅行は出発の2日後に中止された"],a:0},
 {f:"logic",d:1,t:75,u:"論理：howeverの対比",s:"Many companies now allow their employees to work from home. This shift, however, has blurred the line between work and rest, leaving some workers more exhausted than before.",q:"howeverの前後の関係として正しいものは？",c:["在宅勤務の広がりという変化に対して、仕事と休みの境界が曖昧になり、かえって疲れる人もいるという負の側面を対比している","在宅勤務の利点を2つ並べて紹介している","会社側の視点から従業員の視点へ話題を変えている","在宅勤務が広がった原因を説明している"],a:0},
 {f:"para",d:2,t:85,u:"言い換え：far from（否定）",s:"Far from solving the problem, the new policy made matters worse by encouraging the very behavior it was designed to prevent.",q:"上の英文に最も近い意味の英文は？",c:["The new policy not only failed to solve the problem but actually made it worse by promoting the behavior it was supposed to stop.","The new policy solved the problem more quickly than expected.","The policy successfully prevented the harmful behavior.","The policy was designed to encourage new behavior, and it worked well."],a:0},

const app = document.getElementById("app");

function resetState(){
  if(timerId){ clearInterval(timerId); timerId = null; }
  S = {gradeId:null, gradeLabel:"", quizKey:"", school:"", dev:"", qIndex:0, items:[], answers:[], code:""};
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function makeCode(){
  const d = new Date();
  const mmdd = String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let r = "";
  for(let i=0;i<4;i++) r += chars[Math.floor(Math.random()*chars.length)];
  return "TH-" + mmdd + "-" + r;
}

/* ---------- クイズ ---------- */
function startQuiz(){
  const src = QUIZZES[S.quizKey];
  S.items = src.map(q=>{
    const order = shuffle(q.c.map((_,i)=>i));
    return {f:q.f, u:q.u, d:q.d, t:q.t, s:q.s, q:q.q, choices:order.map(i=>q.c[i]), correct:order.indexOf(q.a)};
  });
  S.qIndex = 0; S.answers = [];
  renderQuiz();
}

function pushAnswer(item, st){
  S.answers.push({f:item.f, u:item.u, d:item.d, st:st});
}

function renderQuiz(){
  const item = S.items[S.qIndex];
  const keys = ["A","B","C","D"];
  let html = `<div class="card">
    <div class="quiz-head">
      <span class="qcount">Q ${S.qIndex+1}<small> / 10</small></span>
      <span class="qtotal">英語設計診断</span>
    </div>
    <div class="progress"><i style="width:${(S.qIndex/10)*100}%"></i></div>
    <div class="timer-row">
      <div class="timer-bar"><i id="tbar" style="width:100%"></i></div>
      <span class="timer-num" id="tnum">${item.t}秒</span>
    </div>
    <span class="section-tag">${SECTION_TAG[item.f]}</span>
    <div class="qnote">次の英文を読んで答えてください。</div>
    <div class="passage">${item.s}</div>
    <div class="qtext">${item.q}</div>
    <div class="opts">`;
  item.choices.forEach((c,i)=>{
    html += `<button class="opt" data-i="${i}"><span class="key">${keys[i]}</span><span>${c}</span></button>`;
  });
  html += `<button class="opt opt-idk" data-i="idk"><span class="key">？</span><span>わからない（勘では選ばない）</span></button>`;
  html += `</div></div>`;
  app.innerHTML = html;

  let locked = false;
  const finish = (st)=>{
    if(locked) return;
    locked = true;
    if(timerId){ clearInterval(timerId); timerId = null; }
    app.querySelectorAll(".opt").forEach(x=>x.disabled = true);
    pushAnswer(item, st);
  };
  const next = ()=>{
    S.qIndex++;
    if(S.qIndex < S.items.length) renderQuiz();
    else renderAnalyzing();
  };

  /* 制限時間 */
  const t0 = Date.now();
  const total = item.t * 1000;
  const tbar = document.getElementById("tbar");
  const tnum = document.getElementById("tnum");
  timerId = setInterval(()=>{
    const left = total - (Date.now() - t0);
    if(left <= 0){
      finish("to");
      const ov = document.createElement("div");
      ov.className = "timeup";
      ov.innerHTML = "<span>⏱ 時間切れ</span>";
      document.body.appendChild(ov);
      setTimeout(()=>{ ov.remove(); next(); }, 850);
      return;
    }
    const ratio = left/total;
    tbar.style.width = (ratio*100) + "%";
    const secs = Math.ceil(left/1000);
    tnum.textContent = secs + "秒";
    if(ratio < 0.2){ tbar.classList.add("hurry"); tnum.classList.add("hurry"); }
  }, 150);

  app.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>{
      if(locked) return;
      b.classList.add("selected");
      if(b.dataset.i === "idk"){
        finish("idk");
      } else {
        const i = Number(b.dataset.i);
        finish(i === item.correct ? "ok" : "ng");
      }
      setTimeout(next, 350);
    };
  });
}

/* ---------- 判定ロジック ---------- */
function calcResult(){
  const score = S.answers.reduce((sum,a)=> sum + (a.st==="ok" ? PT[a.d] : 0), 0);
  let level;
  if(score>=88) level=5; else if(score>=70) level=4; else if(score>=50) level=3; else if(score>=30) level=2; else level=1;

  const nOk = S.answers.filter(a=>a.st==="ok").length;
  const nNg = S.answers.filter(a=>a.st==="ng").length;
  const nIdk = S.answers.filter(a=>a.st==="idk").length;
  const nTo = S.answers.filter(a=>a.st==="to").length;

  const fields = ["str","para","logic"];
  const rate = {};
  fields.forEach(f=>{
    const fs = S.answers.filter(a=>a.f===f);
    rate[f] = fs.length ? fs.filter(a=>a.st==="ok").length/fs.length : 0;
  });

  let typeKey;
  const lowCount = fields.filter(f=>rate[f]<0.5).length;
  if(score>=85 && fields.every(f=>rate[f]>=0.7)) typeKey = "jissen";
  else if(nNg>=4 && (nIdk+nTo)<=1 && score<75) typeKey = "kan";
  else if(lowCount>=2) typeKey = "kiso";
  else {
    typeKey = fields.reduce((min,f)=> rate[f] < rate[min] ? f : min, fields[0]);
  }

  const weakUnits = [...new Set(S.answers.filter(a=>a.st!=="ok").map(a=>a.u))].slice(0,4);
  const marks = S.answers.map(a=> a.st==="ok"?"○" : a.st==="ng"?"×" : a.st==="idk"?"？" : "−").join("");
  return {score, level, rate, typeKey, weakUnits, marks, nOk, nNg, nIdk, nTo};
}

function qualityInsight(r){
  if(r.nNg>=4 && (r.nIdk+r.nTo)<=1) return "「わからない」を選ばずに外した誤答が多め。根拠のない“感覚読み”のサインです。";
  if(r.nIdk>=4) return "「わからない」を正直に選べています。伸ばすべき場所がはっきり見えている状態です。";
  if(r.nTo>=3) return "時間切れが多め。読むスピードより先に、「読み方の手順」を固めるのが近道です。";
  if(r.nNg===0 && r.nTo===0 && r.nIdk===0) return "全問、根拠を持って正解。お見事です。";
  return "誤答・わからない・時間切れのバランスから、読み方のクセを面談でさらに深掘りできます。";
}

/* ---------- コピー用テキスト ---------- */
function buildCopyText(r){
  const pct = f => Math.round(r.rate[f]*100) + "％";
  const weak = r.weakUnits.length ? r.weakUnits.join("／") : "なし（全問正解）";
  return [
    "━━━━━━━━━━━━",
    "【英語設計診断 結果】",
    "学年：" + S.gradeLabel,
    "志望校：" + S.school,
    "英語偏差値：" + S.dev,
    "────────────",
    "スコア：" + r.score + "／100（Lv." + r.level + "）",
    "タイプ：" + TYPES[r.typeKey].name,
    "構造把握 " + pct("str") + "｜言い換え " + pct("para") + "｜論理 " + pct("logic"),
    "回答の質：正解" + r.nOk + "・誤答" + r.nNg + "・わからない" + r.nIdk + "・時間切れ" + r.nTo,
    "弱点単元：" + weak,
    "正誤：" + r.marks + "（○正解 ×誤答 ？わからない −時間切れ）",
    "診断コード：" + S.code,
    "━━━━━━━━━━━━",
    "↑このまま送信してください！"
  ].join("\n");
}

    ? r.weakUnits.map(u=>`<span class="wchip">${u}</span>`).join("")
    : `<span class="wchip">なし（全問正解！）</span>`;
  const gapSchool = S.school==="未定" ? "あなたの志望校" : "『"+escapeHtml(S.school)+"』";

  app.innerHTML = `
  <div class="sheet"><div class="sheet-inner">
    <div class="titleblock">
      <div class="tb-left">
        <div class="eyebrow">DIAGNOSIS SHEET</div>
        <h2>英語設計診断 結果</h2>
      </div>
      <div class="tb-right">DATE ${dateStr}<b>${S.code}</b></div>
    </div>

    <div class="profile-row">
      <span>学年：<b>${S.gradeLabel}</b></span>
      <span>志望校：<b>${escapeHtml(S.school)}</b></span>
      <span>英語偏差値：<b>${S.dev}</b></span>
    </div>

    <div class="scorebox">
      <div class="score">${r.score}<small>/100</small></div>
      <div class="lvl">Lv.${r.level}</div>
    </div>

    <div class="typebox">
      <div class="cap">あなたの診断タイプ</div>
      <div class="typename">${type.name}</div>
      <div class="typedesc">${type.desc}</div>
    </div>

    <div class="fields">
      ${["str","para","logic"].map(f=>`
      <div class="frow">
        <span class="fname">${FIELD_LABEL[f]}</span>
        <span class="fbar"><i style="width:${pct(f)}%"></i></span>
        <span class="fpct">${pct(f)}%</span>
      </div>`).join("")}
    </div>

    <div class="quality">
      <div class="cap">回答の質</div>
      <div class="qgrid">
        <div class="qcell"><b>${r.nOk}</b><span>正解</span></div>
        <div class="qcell"><b>${r.nNg}</b><span>誤答</span></div>
        <div class="qcell"><b>${r.nIdk}</b><span>わからない</span></div>
        <div class="qcell"><b>${r.nTo}</b><span>時間切れ</span></div>
      </div>
      <div class="qinsight">${qualityInsight(r)}</div>
    </div>

    <div class="weak">
      <div class="cap">弱点単元</div>
      <div class="weak-chips">${weakHtml}</div>
    </div>

    <div class="comment">${GRADE_COMMENT[S.quizKey]}<br>${LEVEL_COMMENT[r.level]}</div>

    <div class="rx">
      <div class="cap">この夏の処方箋（${type.name}）</div>
      <ol>
        ${type.rx.map((t,i)=>`<li><span class="n">${i+1}</span><span>${t}</span></li>`).join("")}
      </ol>
    </div>

    <div class="gap-line">${gapSchool}までの「具体的な設計」は、<br>ここから先の面談でつくります。</div>

    <div class="gift">
      <div class="cap">送信特典</div>
      ${GIFT_TEXT}
    </div>

    <div class="cta">
      <button class="btn btn-primary" id="copy">結果をコピーする</button>
      <div class="copied" id="copied">コピーしました！LINEを開いて、そのまま貼り付けて送信してください。</div>
      <a class="btn btn-line" href="${LINE_URL}" target="_blank" rel="noopener">LINEを開いて送る</a>
      <p class="cta-note">①「結果をコピーする」→ ②「LINEを開いて送る」→ ③トークに貼り付けて送信</p>
    </div>
  </div></div>
  <div class="retry"><a id="retry">もう一度診断する</a></div>`;

  const copyText = buildCopyText(r);
  document.getElementById("copy").onclick = ()=> doCopy(copyText);
  document.getElementById("retry").onclick = renderStart;
}

function doCopy(text){
  const done = ()=>{
    const el = document.getElementById("copied");
    el.classList.add("show");
    const btn = document.getElementById("copy");
    btn.textContent = "コピーしました ✓";
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand("copy"); done(); }
  catch(e){ alert("コピーできませんでした。結果画面をスクショして送ってください。"); }
  document.body.removeChild(ta);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}

renderStart();
</script>
</body>
</html>
