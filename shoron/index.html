<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#172642">
<title>THINKING 小論文ラボ</title>
<style>
:root{
  --navy:#172642; --navy2:#24365a; --gold:#C8A55A; --paper:#F6F4EF; --card:#fff; --ink:#1C2433; --muted:#6B7280; --line:#E6E2D8;
  --good:#1f7a55; --good-bg:#e4f3ec; --issue:#b4452c; --issue-bg:#fbe9e3; --rule:#8a6a12; --rule-bg:#f8efd2;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink);background:var(--paper);line-height:1.75;font-size:15px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top .brand{font-weight:700;letter-spacing:.06em;font-size:14px;background:none;border:0;color:#fff;padding:0}
header.top .brand small{display:block;font-weight:400;font-size:10px;letter-spacing:.2em;color:var(--gold)}
header.top .who{margin-left:auto;font-size:12px;opacity:.85}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:10px 4px 9px;font-size:12px;text-decoration:none;color:var(--muted);border-top:2px solid transparent;margin-top:-1px}
nav.tabs a.on{color:var(--navy);font-weight:700;border-top-color:var(--gold)}
nav.tabs a b{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--issue);color:#fff;font-size:11px;line-height:18px}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
main.wide{max-width:1240px}
h1{font-size:20px;line-height:1.45;margin:4px 0 12px;font-family:var(--serif);font-weight:700;text-wrap:balance}
h2{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:26px 0 10px;font-weight:700}
h3{font-size:15px;margin:0 0 6px}
p{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card.tap{display:block;text-decoration:none;width:100%;text-align:left}
.card.tap:active{background:#faf8f3}
.muted{color:var(--muted)} .small{font-size:12.5px} .right{text-align:right}
.row{display:flex;gap:10px;align-items:center} .row.top{align-items:flex-start} .grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:11.5px;line-height:20px;padding:0 8px;border-radius:10px;background:#eef0f4;color:var(--navy);white-space:nowrap}
.pill.gold{background:#f6edd6;color:#7a5d14}.pill.wait{background:#eef0f4;color:var(--muted)}.pill.new{background:var(--issue-bg);color:var(--issue)}.pill.ok{background:var(--good-bg);color:var(--good)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700;text-decoration:none;font-size:14px}
.btn.ghost{background:#fff;color:var(--navy)} .btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px} .btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.back{display:inline-block;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:8px}
.hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero .lbl{font-size:11px;letter-spacing:.14em;color:var(--gold)}
.hero .big{font-size:40px;font-weight:700;line-height:1.1}
.hero .big small{font-size:14px;font-weight:400;opacity:.8;margin-left:4px}
.hero .stats{display:flex;gap:18px;margin-top:10px;font-size:12px;opacity:.9}
.hero .stats b{font-size:17px;margin-right:2px}
.band{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);font-weight:700;font-family:var(--serif);font-size:17px;flex:none}
.band.dark{border-color:var(--navy);color:var(--navy)}
.delta{font-size:12.5px;font-weight:700}.delta.up{color:var(--good)}.delta.down{color:var(--issue)}
.essay{font-family:var(--serif);font-size:16px;line-height:2.05;white-space:pre-wrap;word-break:break-word}
.essay mark{background:var(--issue-bg);color:inherit;border-bottom:2px solid var(--issue);padding:2px 0;cursor:pointer;border-radius:2px}
.essay mark.good{background:var(--good-bg);border-color:var(--good)} .essay mark.rule{background:var(--rule-bg);border-color:var(--rule)}
.essay mark sup,.cno{font-family:-apple-system,sans-serif;font-size:10.5px;font-weight:700;color:#fff;background:var(--issue);border-radius:8px;padding:0 5px;margin-left:2px;line-height:16px;display:inline-block;vertical-align:super}
.essay mark.good sup,.cno.good{background:var(--good)} .essay mark.rule sup,.cno.rule{background:var(--rule)}
.cno{vertical-align:baseline;margin:0 6px 0 0}
.cmt{border-left:3px solid var(--issue);padding:8px 0 8px 12px;margin:0 0 12px}
.cmt.good{border-color:var(--good)} .cmt.rule{border-color:var(--rule)} .cmt.hit{background:#fffbea}
.cmt q{display:block;font-family:var(--serif);color:var(--muted);font-size:13px;quotes:"「" "」"}
.cmt .fix{margin-top:6px;padding:8px 10px;background:#f7f8fa;border-radius:8px;font-family:var(--serif);font-size:14px}
.cmt .fix::before{content:"直すなら";display:block;font-family:-apple-system,sans-serif;font-size:10.5px;letter-spacing:.1em;color:var(--muted)}
.crit{padding:10px 0;border-bottom:1px solid var(--line)} .crit:last-child{border:0}
.crit .hd{display:flex;align-items:baseline;gap:8px} .crit .hd b{flex:1}
.meter{display:flex;gap:3px;margin:6px 0 6px} .meter i{flex:1;height:6px;border-radius:3px;background:#e9e6dd} .meter i.on{background:var(--navy)}
.prio{counter-reset:p;padding:0;margin:0;list-style:none}
.prio li{counter-increment:p;position:relative;padding:0 0 14px 34px} .prio li:last-child{padding-bottom:0}
.prio li::before{content:counter(p);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.prio .how{margin-top:6px;padding:8px 10px;background:#f6edd6;border-radius:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;scrollbar-width:none}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
textarea{resize:vertical;line-height:1.9}
textarea.write{font-family:var(--serif);min-height:52vh}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;letter-spacing:.06em}
.bar{position:sticky;bottom:calc(52px + env(safe-area-inset-bottom));background:var(--paper);padding:10px 0;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);z-index:5}
.bar .cnt b{font-size:18px} .bar .cnt.over b{color:var(--issue)}
.qa{padding:8px 12px;border-radius:12px;background:#f1f2f5;margin:0 40px 8px 0;font-size:14px}
.qa.me{margin:0 0 8px 40px;background:#e8eef9}
.qa small{display:block;color:var(--muted);font-size:11px}
.fu{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;font-size:14px}
.fu .st{flex:none;font-size:11.5px;border-radius:10px;padding:0 8px;line-height:20px;background:#eef0f4;color:var(--muted)}
.fu .st.improved{background:var(--good-bg);color:var(--good)} .fu .st.worse{background:var(--issue-bg);color:var(--issue)}
.hbar{display:grid;grid-template-columns:9.5em 1fr 2em;gap:8px;align-items:center;font-size:13px;margin-bottom:7px}
.hbar .t{height:8px;background:#e9e6dd;border-radius:4px;position:relative}
.hbar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--navy)}
.hbar .t u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
svg text{font-family:inherit}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.gate{max-width:420px;margin:18vh auto 0;text-align:center;padding:0 24px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:50;max-width:90vw}
.pv{background:#fff7d6;border-bottom:1px solid #ecd98a;font-size:12px;padding:6px 12px;text-align:center}
.pv a{margin:0 5px;text-decoration:underline;cursor:pointer}
table.q{width:100%;border-collapse:collapse;font-size:13.5px}
table.q th{font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:400;padding:6px 8px;border-bottom:1px solid var(--line)}
table.q td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.q tr.tap{cursor:pointer} table.q tr.tap:hover{background:#faf8f3}
.grade{display:grid;gap:16px}
.lv{display:flex;gap:4px} .lv button{width:34px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:700;font-size:13px}
.lv button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ed textarea{font-size:14px;line-height:1.7;padding:8px 10px}
.ed .box{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fcfbf8}
.ed .x{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.stick{position:sticky;top:52px}
@media(min-width:980px){
  .grade{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
@media(max-width:700px){ table.q .hide-s{display:none} }
</style>
</head>
<body>
<div id="pv"></div>
<header class="top">
  <button class="brand" data-act="home"><small>THINKING</small><span id="brand">小論文ラボ</span></button>
  <span class="who" id="who"></span>
</header>
<main id="app"><div class="empty">読み込んでいます…</div></main>
<nav class="tabs" id="tabs" hidden></nav>

<script>
/* ===== 設定（セットアップ時に2か所だけ埋める）================================ */
var LIFF_ID = "";   // LINE Developers で作った LIFF ID
var GAS_URL = "";   // Apps Script をデプロイした Webアプリの URL（…/exec）
/* ========================================================================= */

var PREVIEW = /[?&]preview=1/.test(location.search);
var S = { user: null, cfg: {}, rubric: [], tags: [], tasks: [], subs: [], all: null, students: [] };
var $ = function (id) { return document.getElementById(id); };

/* ---------- 小さな道具 ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function load(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
function save(key, v) { try { if (v == null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function md(iso) { if (!iso) return ""; var d = new Date(iso); return (d.getMonth() + 1) + "/" + d.getDate(); }
function ago(iso) {
  var h = (Date.now() - new Date(iso).getTime()) / 3600000;
  return h < 1 ? "1時間以内" : h < 24 ? Math.floor(h) + "時間前" : Math.floor(h / 24) + "日前";
}
function count(t) { return String(t || "").replace(/\s/g, "").length; }
function taskOf(id) { return S.tasks.filter(function (t) { return t.id === id; })[0] || { id: id, title: "（削除された課題）", fac: "", uni: "", limit: 0, q: "", text: "" }; }
function toast(msg) {
  var el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 2600);
}
function isStaff() { return S.user && S.user.role === "staff"; }
function byAt(a, b) { return a.at < b.at ? -1 : 1; }
function done(subs) { return subs.filter(function (s) { return s.state === "done" && s.review; }).sort(byAt); }

/** 観点ごとのレベルと学部の配点から総合点を出す（GAS の total_ と同じ計算。講師の画面ですぐ点が変わるように端末でも計算する） */
function calcTotal(scores, fac) {
  var sum = 0, ws = 0;
  S.rubric.forEach(function (c) {
    var w = c.w[fac] || c.w["既定"] || 0;
    var s = (scores || []).filter(function (x) { return x.k === c.k; })[0];
    sum += w * Math.max(1, Math.min(5, Number(s && s.lv) || 1)) / 5; ws += w;
  });
  var t = ws ? Math.round(sum * 100 / ws) : 0;
  return { total: t, band: t >= 85 ? "S" : t >= 72 ? "A" : t >= 58 ? "B" : t >= 44 ? "C" : "D" };
}

/* ---------- 通信 ---------- */
function api(action, body) {
  if (PREVIEW) return window.MOCK_API(action, body);
  var token = idToken();
  if (!token) return Promise.reject(new Error("login"));
  var payload = Object.assign({ action: action, token: token }, body || {});
  // Content-Type を付けない（付けると CORS の事前確認が起きて GAS が失敗する）
  return fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) }).then(function (r) { return r.json(); }).then(function (res) {
    if (res.status === "unauthorized") { relogin(); throw new Error("login"); }
    return res;
  });
}
/** 期限切れのIDトークンを送らない（LINE内ブラウザは古いトークンを返すことがある） */
function idToken() {
  try {
    var d = liff.getDecodedIDToken();
    if (!d || d.exp * 1000 < Date.now() + 60000) { relogin(); return ""; }
    return liff.getIDToken();
  } catch (e) { return ""; }
}
function relogin() {
  try { if (sessionStorage.getItem("sr.relogin")) return; sessionStorage.setItem("sr.relogin", "1"); } catch (e) {}
  liff.logout(); liff.login({ redirectUri: location.href });
}
function loadScript(src) {
  return new Promise(function (ok, ng) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ng; document.head.appendChild(s); });
}

/* ---------- 起動 ---------- */
function start() {
  if (PREVIEW) { loadScript("mock.js").then(boot); showPreviewBar(); return; }
  if (!LIFF_ID || !GAS_URL) { gate("準備中", "小論文ラボの設定がまだ完了していません。"); return; }
  loadScript("https://static.line-scdn.net/liff/edge/2/sdk.js")
    .then(function () { return liff.init({ liffId: LIFF_ID }); })
    .then(function () { if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; } return boot(); })
    .catch(function () { gate("LINEから開いてください", "このページはLINEアプリの中で開くと使えます。"); });
}
function boot() {
  return api("boot").then(function (res) {
    if (res.status !== "ok") throw new Error(res.reason || "error");
    try { sessionStorage.removeItem("sr.relogin"); } catch (e) {}
    S.user = res.user; S.cfg = res.cfg; S.rubric = res.rubric; S.tags = res.tags; S.tasks = res.tasks; S.subs = res.subs;
    $("brand").textContent = (S.cfg.title || "小論文ラボ").replace(/^THINKING\s*/, "");
    $("who").textContent = S.user.name + (isStaff() ? "（講師）" : "");
    return isStaff() ? loadQueue() : null;
  }).then(route).catch(function (e) { if (e.message !== "login") gate("通信できませんでした", "電波の良い場所で、もう一度開いてください。"); });
}
function loadQueue() {
  return api("queue").then(function (res) { if (res.status === "ok") { S.all = res.subs; S.students = res.students; } });
}
function gate(title, text) {
  $("tabs").hidden = true;
  $("app").className = "";
  $("app").innerHTML = '<div class="gate"><h1>' + esc(title) + '</h1><p class="muted">' + esc(text) + "</p></div>";
}
function showPreviewBar() {
  var r = (/[?&]role=(\w+)/.exec(location.search) || [])[1] || "student";
  $("pv").innerHTML = '<div class="pv">プレビュー（仮のデータ）｜表示：'
    + [["student", "生徒"], ["staff", "講師"], ["guest", "未登録"]].map(function (x) {
      return x[0] === r ? "<b>" + x[1] + "</b>" : '<a href="?preview=1&role=' + x[0] + '">' + x[1] + "</a>";
    }).join(" ") + '｜<a data-act="reset">最初の状態に戻す</a></div>';
}

/* ---------- 画面の切り替え ---------- */
var VIEW = {};
function route() {
  var h = location.hash.replace(/^#\/?/, "").split("/");
  var name = h[0] || (isStaff() ? "queue" : "home");
  if (!VIEW[name]) name = isStaff() ? "queue" : "home";
  stopTimer();
  var wide = name === "grade" || name === "queue" || name === "students" || name === "student";
  $("app").className = wide ? "wide" : "";
  $("app").innerHTML = VIEW[name](decodeURIComponent(h[1] || ""), decodeURIComponent(h[2] || ""));
  renderTabs(name);
  if (AFTER[name]) AFTER[name](decodeURIComponent(h[1] || ""));
  window.scrollTo(0, 0);
}
var AFTER = {};
function renderTabs(name) {
  var tabs = isStaff()
    ? [["queue", "添削", (S.all || []).filter(function (s) { return s.raw !== "返却済"; }).length], ["students", "生徒"], ["tasks", "課題"]]
    : [["home", "ホーム"], ["tasks", "課題"], ["subs", "提出", S.subs.filter(function (s) { return s.state === "done" && !s.seen; }).length], ["growth", "成長"]];
  var group = { task: "tasks", write: "tasks", sub: "subs", grade: "queue", student: "students" }[name] || name;
  $("tabs").hidden = false;
  $("tabs").innerHTML = tabs.map(function (t) {
    return '<a href="#/' + t[0] + '" class="' + (t[0] === group ? "on" : "") + '">' + t[1] + (t[2] ? "<b>" + t[2] + "</b>" : "") + "</a>";
  }).join("");
}
window.addEventListener("hashchange", route);

/* ======================================================================
 * 生徒の画面
 * ==================================================================== */

VIEW.home = function () {
  if (S.user.role === "guest") {
    return '<h1>小論文ラボへようこそ</h1><div class="card"><p>答案を出すと、観点ごとの評価と、次に直すところが返ってきます。書き直して再提出すると、前回との違いも分かります。</p>'
      + '<p class="muted small">提出には受講の登録が必要です。見本の課題は「課題」から読めます。</p>'
      + '<a class="btn block" href="' + esc(S.cfg.lineUrl || "#") + '">公式LINEで問い合わせる</a></div>';
  }
  var d = done(S.subs), last = d[d.length - 1], prev = d[d.length - 2];
  var waiting = S.subs.filter(function (s) { return s.state === "wait"; });
  var html = "";
  if (last) {
    var diff = prev ? last.review.total - prev.review.total : null;
    html += '<div class="hero"><div class="row"><div class="grow"><div class="lbl">最新の添削</div><div class="big num">' + last.review.total + "<small>点</small></div></div>"
      + '<span class="band">' + last.review.band + "</span></div>"
      + '<div class="stats"><span><b class="num">' + S.subs.length + "</b>本 提出</span><span><b class=\"num\">" + S.subs.filter(function (s) { return s.ver > 1; }).length + "</b>本 書き直し</span>"
      + (diff != null ? "<span>前回より <b class=\"num\">" + (diff > 0 ? "+" : "") + diff + "</b>点</span>" : "") + "</div></div>";
  } else {
    html += '<div class="hero"><div class="lbl">小論文ラボ</div><p style="margin:6px 0 0">1本書いて出すと、観点ごとの評価と「次に直すこと」が返ってきます。</p></div>';
  }

  html += "<h2>次にやること</h2>";
  var unseen = S.subs.filter(function (s) { return s.state === "done" && !s.seen; }).sort(byAt).pop();
  var todo = "";
  if (unseen) {
    todo += '<a class="card tap" href="#/sub/' + unseen.id + '"><span class="pill new">返却</span> <b>添削が返ってきました</b><div class="muted small">' + esc(taskOf(unseen.task).title) + "・" + unseen.review.total + "点</div></a>";
  }
  var re = rewriteTarget();
  if (re && (!unseen || unseen.id !== re.id)) {
    todo += '<a class="card tap" href="#/write/' + re.task + '"><span class="pill gold">書き直し</span> <b>' + esc(taskOf(re.task).title) + '</b><div class="muted small">前回 ' + re.review.total + "点。最優先：" + esc((re.review.priorities[0] || {}).t || "") + "</div></a>";
  }
  if (waiting.length) todo += '<a class="card tap" href="#/subs"><span class="pill wait">添削中</span> <b>' + waiting.length + "本</b>を添削しています</a>";
  var next = nextTask();
  if (next) todo += '<a class="card tap" href="#/task/' + next.id + '"><span class="pill">新しい課題</span> <b>' + esc(next.title) + '</b><div class="muted small">' + esc(next.uni + " " + next.fac + "学部") + "・" + next.limit + "字</div></a>";
  html += todo || '<div class="card muted">すべての課題に取り組みました。</div>';

  if (last) {
    var tags = tagCounts(d).slice(0, 3);
    html += "<h2>いまの自分の課題</h2><div class=\"card\">"
      + (last.review.next ? "<p><b>次の1本で意識すること</b><br>" + esc(last.review.next) + "</p>" : "")
      + (tags.length ? '<p class="muted small" style="margin:0 0 6px">くり返し指摘されていること</p><div class="chips">' + tags.map(function (t) { return '<span class="chip">' + esc(t[0]) + " ×" + t[1] + "</span>"; }).join("") + "</div>" : "")
      + "</div>";
  }
  return html;
};

/** 書き直すとよい提出：返却済みで、同じ課題の新しい版がまだなく、A 評価に届いていないもの（新しい順） */
function rewriteTarget() {
  var d = done(S.subs).reverse();
  for (var i = 0; i < d.length; i++) {
    var s = d[i];
    var newer = S.subs.some(function (x) { return x.task === s.task && x.ver > s.ver; });
    if (!newer && s.review.total < 72) return s;
  }
  return null;
}
function nextTask() {
  var tried = {};
  S.subs.forEach(function (s) { tried[s.task] = true; });
  var open = S.tasks.filter(function (t) { return !tried[t.id]; });
  return open.filter(function (t) { return t.fac === S.user.target; })[0] || open[0] || null;
}
function tagCounts(subs) {
  var m = {};
  subs.forEach(function (s) { (s.review.tags || []).forEach(function (t) { m[t] = (m[t] || 0) + 1; }); });
  return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
}

function stopTimer() { if (TICK) { clearInterval(TICK); TICK = null; } }
function addPhotos(files) {
  Array.prototype.slice.call(files, 0, 6 - W.photos.length).forEach(function (f) {
    var img = new Image();
    img.onload = function () {
      // 長い辺を1600pxに縮めてから送る（そのままだと大きすぎて送れない）
      var k = Math.min(1, 1600 / Math.max(img.width, img.height));
      var c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

      updateCount(); URL.revokeObjectURL(img.src);

}

/* ---------- 添削を読む ---------- */

/** 本文に、行内コメントの引用箇所を印として入れる。引用が本文に見つからないコメントは印なしで一覧だけに出す */
function markText(text, inline) {
  var hits = [];
  (inline || []).forEach(function (c, i) {
    if (!c.q) return;
    var from = 0, at;
    while ((at = text.indexOf(c.q, from)) >= 0) {
      var clash = hits.some(function (h) { return at < h.e && at + c.q.length > h.s; });
      if (!clash) { hits.push({ s: at, e: at + c.q.length, i: i, kind: c.kind }); break; }
      from = at + 1;
    }
  });
  hits.sort(function (a, b) { return a.s - b.s; });
  var out = "", pos = 0;
  hits.forEach(function (h) {
    out += esc(text.slice(pos, h.s)) + '<mark class="' + h.kind + '" data-act="cmt" data-i="' + h.i + '">' + esc(text.slice(h.s, h.e)) + "<sup>" + (h.i + 1) + "</sup></mark>";
    pos = h.e;
  });
  return out + esc(text.slice(pos));
}
function meter(lv) { var s = ""; for (var i = 1; i <= 5; i++) s += '<i class="' + (i <= lv ? "on" : "") + '"></i>'; return '<div class="meter" role="img" aria-label="5段階の' + lv + '">' + s + "</div>"; }

function reviewHtml(s, prev) {
  var r = s.review, t = taskOf(s.task);
  var diff = prev ? r.total - prev.review.total : null;
  var html = '<div class="hero"><div class="row"><div class="grow"><div class="lbl">総合</div><div class="big num">' + r.total + "<small>/ 100点</small></div>"
    + (diff != null ? '<div class="small" style="margin-top:4px">前回（' + md(prev.at) + "）" + prev.review.total + "点 → <b>" + (diff > 0 ? "+" : "") + diff + "点</b></div>" : "") + "</div>"
    + '<span class="band">' + r.band + "</span></div></div>";
  if (r.teacher) html += '<div class="card"><h3>講師から</h3><p style="margin:0">' + esc(r.teacher) + "</p></div>";
  html += '<div class="card"><h3>総評</h3><p style="margin:0;white-space:pre-wrap">' + esc(r.summary) + "</p></div>";

  if (r.priorities.length) {
    html += "<h2>直せばいちばん伸びるところ</h2><div class=\"card\"><ol class=\"prio\">" + r.priorities.map(function (p) {
      return "<li><b>" + esc(p.t) + '</b><div class="small muted">' + esc(p.why) + '</div><div class="how">' + esc(p.how) + "</div></li>";
    }).join("") + "</ol></div>";
  }
  if ((r.followup || []).length) {
    var lbl = { improved: "良くなった", same: "変わらず", worse: "後退" };
    html += "<h2>前回までの指摘はどうなったか</h2><div class=\"card\">" + r.followup.map(function (f) {
      return '<div class="fu"><span class="st ' + f.state + '">' + lbl[f.state] + "</span><div><b>" + esc(f.tag) + "</b>　" + esc(f.note) + "</div></div>";
    }).join("") + "</div>";
  }

  html += "<h2>観点ごとの評価</h2><div class=\"card\">" + S.rubric.map(function (c) {
    var x = r.scores.filter(function (y) { return y.k === c.k; })[0] || { lv: 1, why: "" };
    var p = prev && (prev.review.scores.filter(function (y) { return y.k === c.k; })[0] || {}).lv;
    var d = p ? x.lv - p : 0;
    return '<div class="crit"><div class="hd"><b>' + esc(c.n) + '</b><span class="muted small num">配点' + (c.w[t.fac] || c.w["既定"]) + '</span><span class="num"><b>' + x.lv + "</b> / 5</span>"
      + (d ? '<span class="delta ' + (d > 0 ? "up" : "down") + '">' + (d > 0 ? "↑" : "↓") + Math.abs(d) + "</span>" : "") + "</div>" + meter(x.lv)
      + '<div class="small">' + esc(x.why) + "</div></div>";
  }).join("") + "</div>";

  html += "<h2>答案への書き込み</h2><div class=\"card\"><div class=\"essay\" id=\"essay\">" + markText(s.text, r.inline) + "</div></div>";
  if (r.inline.length) {
    html += '<div class="card" id="cmts">' + r.inline.map(function (c, i) {
      return '<div class="cmt ' + c.kind + '" id="cmt-' + i + '"><span class="cno ' + c.kind + '">' + (i + 1) + "</span><b>" + { good: "良い", issue: "内容・論理", rule: "表記・決まり" }[c.kind] + "</b>"
        + (c.q ? "<q>" + esc(c.q) + "</q>" : "") + "<div>" + esc(c.c) + "</div>" + (c.fix ? '<div class="fix">' + esc(c.fix) + "</div>" : "") + "</div>";
    }).join("") + "</div>";
  }
  if (r.strengths.length) html += "<h2>良いところ（次も続ける）</h2><div class=\"card\"><ul style=\"margin:0;padding-left:1.2em\">" + r.strengths.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
  if (r.outline.length) {
    html += "<h2>段落の役割</h2><div class=\"card\">" + r.outline.map(function (o, i) {
      return '<div class="row top" style="margin-bottom:6px"><span class="pill num">' + (i + 1) + '</span><div class="grow"><b>' + esc(o.role) + '</b> <span class="muted small">' + esc(o.note) + "</span></div></div>";
    }).join("") + "</div>";
  }
  if (r.rewrite) html += "<h2>書き直しの設計図</h2><div class=\"card\"><p style=\"margin:0;white-space:pre-wrap\">" + esc(r.rewrite) + "</p></div>";
  if (r.next) html += '<div class="card" style="border-color:var(--gold)"><h3>次の1本で意識すること</h3><p style="margin:0">' + esc(r.next) + "</p></div>";
  return html;
}

/* ---------- 成長 ---------- */

/** 総合点の推移（1本の折れ線。点は提出の順に等間隔。各点に課題名と点を出す） */
function trendSvg(d) {
  var w = 520, h = 190, l = 40, r = 22, t = 22, b = 26;
  var x = function (i) { return d.length === 1 ? (l + (w - r)) / 2 : l + (w - l - r) * i / (d.length - 1); };
  var y = function (v) { return t + (h - t - b) * (1 - v / 100); };
  var grid = [0, 50, 100].map(function (v) {
    return '<line x1="' + l + '" x2="' + (w - r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e6e2d8"/><text x="' + (l - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#6B7280">' + v + "</text>";
  }).join("");
  var pts = d.map(function (s, i) { return x(i) + "," + y(s.review.total); }).join(" ");
  var dots = d.map(function (s, i) {
    var last = i === d.length - 1;
    return '<g><title>' + esc(md(s.at) + " " + taskOf(s.task).title + "（" + s.ver + "回目）" + s.review.total + "点") + '</title><circle cx="' + x(i) + '" cy="' + y(s.review.total) + '" r="12" fill="transparent"/>'
      + '<circle cx="' + x(i) + '" cy="' + y(s.review.total) + '" r="' + (last ? 5 : 4) + '" fill="' + (s.ver > 1 ? "#C8A55A" : "#172642") + '" stroke="#fff" stroke-width="2"/>'
      + '<text x="' + x(i) + '" y="' + (y(s.review.total) - 10) + '" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1C2433">' + s.review.total + "</text>"
      + '<text x="' + x(i) + '" y="' + (h - 8) + '" text-anchor="middle" font-size="10.5" fill="#6B7280">' + md(s.at) + "</text></g>";
  }).join("");
  return '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" role="img" aria-label="総合点の推移">' + grid
    + (d.length > 1 ? '<polyline points="' + pts + '" fill="none" stroke="#172642" stroke-width="2" stroke-linejoin="round"/>' : "") + dots + "</svg>"
    + '<div class="muted small"><span style="color:#172642">●</span> 初回　<span style="color:#C8A55A">●</span> 書き直し</div>';
}

function growthHtml(subs) {
  var d = done(subs);
  if (!d.length) return '<div class="empty">添削が返ってくると、ここに推移が出ます。</div>';
  var recent = d.slice(-3), early = d.slice(0, Math.max(0, d.length - 3));
  var avg = function (list, k) {
    if (!list.length) return null;
    return list.reduce(function (a, s) { return a + ((s.review.scores.filter(function (x) { return x.k === k; })[0] || {}).lv || 0); }, 0) / list.length;
  };
  var html = "<h2>総合点の推移</h2><div class=\"card\">" + trendSvg(d) + "</div>";
  html += "<h2>観点ごとの平均（直近3本）</h2><div class=\"card\">" + S.rubric.map(function (c) {
    var a = avg(recent, c.k), e = avg(early, c.k);
    return '<div class="hbar" title="' + esc(c.n) + " 直近 " + a.toFixed(1) + (e != null ? " ／ それ以前 " + e.toFixed(1) : "") + '"><span>' + esc(c.n) + '</span><span class="t"><i style="width:' + (a * 20) + '%"></i>' + (e != null ? '<u style="left:' + (e * 20) + '%"></u>' : "") + '</span><b class="num">' + a.toFixed(1) + "</b></div>";
  }).join("") + (early.length ? '<div class="muted small"><span style="color:var(--gold)">┃</span> それ以前の平均</div>' : "") + "</div>";
  var tags = tagCounts(d);
  if (tags.length) {
    var max = tags[0][1];

var ACT = {

  cmt: function (el) {

  submit: function (el) {

    var warn = W.mode === "text" && t.limit ? (n > t.limit ? "字数が上限を超えています（" + n + "字）。" : n < t.limit * 0.8 ? "字数が上限の8割に届いていません（" + n + " / " + t.limit + "字）。" : "") : "";

    api("submit", { task: W.task, text: text, photos: W.mode === "photo" ? W.photos : [], memo: $("w-memo").value, min: Math.round(W.sec / 60) }).then(function (res) {
      if (res.status !== "ok") { toast(res.reason || "提出できませんでした"); el.disabled = false; return; }

    }).catch(function () { toast("通信できませんでした。もう一度お試しください"); el.disabled = false; });
  },
  ask: function (el) {

      [S.subs, S.all || []].forEach(function (list) { var s = list.filter(function (x) { return x.id === id; })[0]; if (s) s.qa = (s.qa || []).concat([res.qa]); });

    }).catch(function () { toast("通信できませんでした"); el.disabled = false; });
  },
  lv: function (el) { G.r.scores[Number(el.getAttribute("data-i"))].lv = Number(el.getAttribute("data-v")); redrawGrade(); },

    var id = el.getAttribute("data-id");
    el.disabled = true; el.textContent = "作成中…";
    api("aiDraft", { sub: id }).then(function (res) {
      if (res.status !== "ok") { toast(res.reason || "作れませんでした"); el.disabled = false; el.textContent = "AIで下書き"; return; }
      return loadQueue().then(function () { G = null; route(); toast("AI の下書きを読み込みました"); });
    }).catch(function () { toast("通信できませんでした"); el.disabled = false; });
  },
  note: function (el) {
    var uid = el.getAttribute("data-id"), text = $("note").value;
    api("note", { uid: uid, text: text }).then(function (res) {
      if (res.status === "ok") { S.students.filter(function (u) { return u.uid === uid; })[0].note = text; toast("保存しました"); } else toast(res.reason || "保存できませんでした");
    });
  }
};
document.addEventListener("click", function (e) {
  var el = e.target.closest && e.target.closest("[data-act]");
  if (el && ACT[el.getAttribute("data-act")]) ACT[el.getAttribute("data-act")](el, e);
});

start();
</script>
</body>
</html>
